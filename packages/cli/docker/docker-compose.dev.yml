services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # - postgres_data:/var/lib/pos/tgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped

  auth-migrate:
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=auth
      - IDENTITY_SCHEMA_URL=http://rest-api:8080/api/v1/auth/identity-schema
      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS-{}}
      - WAIT_FOR_API_HEALTH=true
      - API_URL=http://rest-api:8080

    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth
    command: migrate sql -e --yes
    restart: on-failure
    networks:
      - app-network
    depends_on:
      - postgres
      - rest-api

  auth:
    depends_on:
      - auth-migrate
      - rest-api
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    env_file:
      - ${OMNIBASE_ENV_FILE}
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    restart: unless-stopped
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=auth
      - IDENTITY_SCHEMA_URL=http://rest-api:8080/api/v1/auth/identity-schema

      # Required - will fail if not set
      - WEBSITE_URL=${WEBSITE_URL}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CIPHER_SECRET=${CIPHER_SECRET}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-127.0.0.1}

      # Optional with defaults
      - LOG_LEVEL=${AUTH_LOG_LEVEL:-info}
      - AUTH_URL=${AUTH_URL:-http://127.0.0.1:4433}
      - AUTH_ADMIN_URL=${AUTH_ADMIN_URL:-http://auth:4434}

      - WEBSITE_AUTH_ERROR_URL=${WEBSITE_AUTH_ERROR_URL:-${WEBSITE_URL}/auth/error}
      - WEBSITE_SETTING_URL=${WEBSITE_SETTING_URL:-${WEBSITE_URL}/auth/settings}
      - WEBSITE_RECOVERY_URL=${WEBSITE_RECOVERY_URL:-${WEBSITE_URL}/auth/recovery}
      - WEBSITE_VERIFICATION_RECOVERY_URL=${WEBSITE_VERIFICATION_RECOVERY_URL:-${WEBSITE_URL}/auth/verification}
      - WEBSITE_LOGIN_URL=${WEBSITE_LOGIN_URL:-${WEBSITE_URL}/auth/login}
      - WEBSITE_REGISTRATION_URL=${WEBSITE_REGISTRATION_URL:-${WEBSITE_URL}/auth/registration}

      - SMTP_CONNECTION_URI=${SMTP_CONNECTION_URI:-smtp://mailpit:1025?disable_starttls=true}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-no-reply@omnibase.tech}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-"Omnibase Auth"}

      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS-{}}
      - API_URL=http://rest-api:8080
      - WAIT_FOR_API_HEALTH=true
      - APP_NAME=${APP_NAME:-"My App"}
    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth
    command: serve --dev --watch-courier
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - app-network
    restart: unless-stopped

  # MinIO - Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    restart: unless-stopped
  # Create MinIO bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/dev --ignore-existing;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - app-network

  # Adminer - Simple Database Management Interface
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # PostgREST - Auto-generated REST API from PostgreSQL schema
  postgrest:
    image: postgrest/postgrest:v12.2.0
    ports:
      - "8001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/db
      PGRST_DB_SCHEMAS: public,auth,storage
      PGRST_DB_ANON_ROLE: anon_user
      PGRST_JWT_SECRET: ${JWT_SIGNING_KEY:-your-secret-jwt-signing-key-change-this-in-production}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:8001
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # REST API Service
  rest-api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ../../../apps/api:/app
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped
    environment:
      # Application
      - PORT=8080
      - AUTH_URL=http://auth:4433
      - AUTH_ADMIN_URL=http://auth:4434

      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=db

      # S3/MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://127.0.0.1:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=files
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
      - S3_FORCE_PATH_STYLE=true
      - S3_BUCKET_NAME=dev

      # Email Configuration
      - SMTP_CONNECTION_URI=smtp://mailpit:1025
      - SMTP_FROM_EMAIL=noreply@yourapp.com
      - FRONTEND_URL=http://localhost:3000

      # JWT Configuration
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-your-secret-jwt-signing-key-change-this-in-production}
      - JWT_SECRET=${JWT_SECRET:-VERY_SECRET_KEY}

      # Permissions Configuration
      - PERMISSIONS_READ_URL=http://permissions:4466
      - PERMISSIONS_WRITE_URL=http://permissions:4467

      # PostgREST Configuration
      - POSTGREST_URL=http://postgrest:3000

      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

      - LOG_LEVEL=${LOG_LEVEL:-TRACE}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}

      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS}
  # Permissions Migration
  permissions-migrate:
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=permissions
    command: migrate up -c /etc/config/permissions/permissions.yml --yes
    restart: on-failure
    networks:
      - app-network
    depends_on:
      - postgres
      - rest-api

  permissions:
    depends_on:
      - permissions-migrate
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile
    ports:
      - "4466:4466" # read API
      - "4467:4467" # write API
    restart: unless-stopped
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=permissions
      - LOG_LEVEL=debug
      - NAMESPACE_BUCKET=dev
      - R2_ENDPOINT=http://minio:9000
      - R2_ACCESS_KEY=minioadmin
      - R2_SECRET_KEY=minioadmin123
    command: serve -c /etc/config/permissions/permissions.yml
    networks:
      - app-network

  postgres-type-gen:
    image: supabase/postgres-meta:canary-pr-971
    ports:
      - 8079:8080
    environment:
      - PG_META_DB_HOST=postgres
      - PG_META_DB_NAME=db
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=postgres
      - PG_META_DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  app-network:
    driver: bridge
