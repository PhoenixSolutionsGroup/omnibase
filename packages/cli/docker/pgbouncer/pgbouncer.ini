[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256

; auth_file is auto-generated by edoburu/pgbouncer from DATABASE_URL
auth_file = /etc/pgbouncer/userlist.txt

; Use auth_query for dynamic user authentication from PostgreSQL
; auth_user connects to PostgreSQL to run auth_query
auth_user = postgres
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; Pool settings - transaction mode for high concurrency
; NOTE: These are generous for stress testing. Tune down for production multi-tenant.
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 20
reserve_pool_timeout = 3

; Enable prepared statement tracking (PgBouncer 1.21+)
; This allows transaction pooling to work with prepared statements
max_prepared_statements = 100

; Connection limits - generous for stress testing
max_db_connections = 200
max_user_connections = 200

; Timeouts
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
query_timeout = 0
query_wait_timeout = 120

; Startup parameters to ignore (search_path is handled by user defaults)
ignore_startup_parameters = extra_float_digits

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin access
admin_users = postgres
stats_users = postgres
