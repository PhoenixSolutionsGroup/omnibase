services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    # Increase max_connections for stress testing (default is 100)
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # PgBouncer - Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/db
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  db-migrate:
    image: migrate/migrate:latest
    volumes:
      - ./db:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/db?sslmode=disable&x-migrations-table=migrations.init_migrations",
        "up",
      ]
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  auth-migrate:
    image: phoenixsolutionsgroup/omnibase-auth:v0.1.2
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=auth
      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS-{}}
      - WAIT_FOR_API_HEALTH=true
      - API_URL=http://rest-api:8080
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    command: migrate sql -e --yes
    restart: on-failure
    networks:
      - app-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rest-api:
        condition: service_started
  auth:
    depends_on:
      - auth-migrate
      - rest-api
      - pgbouncer
    image: phoenixsolutionsgroup/omnibase-auth:v0.1.2
    restart: unless-stopped
    env_file:
      - ${OMNIBASE_ENV_FILE}
    environment:
      - DSN=postgres://auth:auth@pgbouncer:6432/db?sslmode=disable&max_conns=20&max_idle_conns=4

      # Required - will fail if not set
      - WEBSITE_URL=${WEBSITE_URL:-http://127.0.0.1:3000}
      - COOKIE_SECRET=${COOKIE_SECRET:-PLEASE-CHANGE-ME-I-AM-VERY-INSECURE}
      - CIPHER_SECRET=${CIPHER_SECRET:-32-LONG-SECRET-NOT-SECURE-AT-ALL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-127.0.0.1}

      # Optional with defaults
      - LOG_LEVEL=${AUTH_LOG_LEVEL:-info}
      - AUTH_URL=${AUTH_URL:-http://127.0.0.1:4433}
      - AUTH_ADMIN_URL=${AUTH_ADMIN_URL:-http://auth:4434}

      - WEBSITE_AUTH_ERROR_URL=${WEBSITE_AUTH_ERROR_URL:-${WEBSITE_URL}/auth/error}
      - WEBSITE_SETTING_URL=${WEBSITE_SETTING_URL:-${WEBSITE_URL}/auth/settings}
      - WEBSITE_RECOVERY_URL=${WEBSITE_RECOVERY_URL:-${WEBSITE_URL}/auth/recovery}
      - WEBSITE_VERIFICATION_RECOVERY_URL=${WEBSITE_VERIFICATION_RECOVERY_URL:-${WEBSITE_URL}/auth/verification}
      - WEBSITE_LOGIN_URL=${WEBSITE_LOGIN_URL:-${WEBSITE_URL}/auth/login}
      - WEBSITE_REGISTRATION_URL=${WEBSITE_REGISTRATION_URL:-${WEBSITE_URL}/auth/registration}

      - SMTP_CONNECTION_URI=${SMTP_CONNECTION_URI:-smtp://mailpit:1025?disable_starttls=true}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-no-reply@omnibase.tech}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-"Omnibase Auth"}

      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS-{}}
      - API_URL=http://rest-api:8080
      - SERVICE_KEY=VERY_SECRET_KEY
      - WAIT_FOR_API_HEALTH=true
      - APP_NAME=${APP_NAME:-"My App"}
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    command: serve --dev --watch-courier
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - app-network
    restart: unless-stopped

  # MinIO - Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    networks:
      - app-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/dev --ignore-existing;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - app-network

  # Adminer - Simple Database Management Interface
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped

  # PostgREST - Auto-generated REST API from PostgreSQL schema
  postgrest:
    image: postgrest/postgrest:v12.2.0
    ports:
      - "8001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@pgbouncer:6432/db
      PGRST_DB_SCHEMAS: public,auth,storage
      PGRST_DB_ANON_ROLE: anon_user
      PGRST_JWT_SECRET: ${JWT_SIGNING_KEY:-your-secret-jwt-signing-key-change-this-in-production}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:8001
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # REST API Service
  rest-api:
    image: phoenixsolutionsgroup/omnibase-api:v0.1.2
    ports:
      - "8080:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    environment:
      # Application
      - PORT=8080
      - AUTH_URL=http://auth:4433
      - AUTH_ADMIN_URL=http://auth:4434

      # Database (via pgbouncer)
      - DB_HOST=pgbouncer
      - DB_PORT=6432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=db

      # S3/MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://127.0.0.1:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=dev
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
      - S3_FORCE_PATH_STYLE=true

      # Email Configuration
      - SMTP_CONNECTION_URI=smtp://mailpit:1025
      - SMTP_FROM_EMAIL=noreply@yourapp.com
      - FRONTEND_URL=http://localhost:3000

      # JWT Configuration
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-your-secret-jwt-signing-key-change-this-in-production}
      - JWT_SECRET=${JWT_SECRET:-VERY_SECRET_KEY}

      # Permissions Configuration
      - PERMISSIONS_READ_URL=http://permissions:4466
      - PERMISSIONS_WRITE_URL=http://permissions:4467

      # PostgREST Configuration
      - POSTGREST_URL=http://postgrest:3000

      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

      - LOG_LEVEL=${LOG_LEVEL:-TRACE}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}

      - AUTH_JWT_JWKS=${AUTH_JWT_JWKS}

  permissions-migrate:
    image: phoenixsolutionsgroup/omnibase-permissions:v0.1.1
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/db?sslmode=disable&max_conns=20&max_idle_conns=4&search_path=permissions
    command: migrate up -c /etc/config/permissions/permissions.yml --yes
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: on-failure
    networks:
      - app-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rest-api:
        condition: service_started

  permissions:
    depends_on:
      - permissions-migrate
      - pgbouncer
    image: phoenixsolutionsgroup/omnibase-permissions:v0.1.1
    restart: unless-stopped
    environment:
      - DSN=postgres://permissions:permissions@pgbouncer:6432/db?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=debug
      - NAMESPACE_BUCKET=dev
      - R2_ENDPOINT=http://minio:9000
      - R2_ACCESS_KEY=minioadmin
      - R2_SECRET_KEY=minioadmin123
    command: serve -c /etc/config/permissions/permissions.yml
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - app-network

  postgres-type-gen:
    image: supabase/postgres-meta:canary-pr-971
    environment:
      - PG_META_DB_HOST=postgres
      - PG_META_DB_NAME=db
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=postgres
      - PG_META_DB_PORT=5432
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
