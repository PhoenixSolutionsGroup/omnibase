# Test overrides - local builds without hot-reload (runs Go binary directly)
services:
  postgres:
    volumes:
      # Override: no persistent volume for ephemeral test data
      - ./db:/docker-entrypoint-initdb.d

  auth-migrate:
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth

  auth:
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth

  rest-api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile.test
    volumes:
      - ../../../apps/api:/app

  permissions-migrate:
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile

  permissions:
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile
