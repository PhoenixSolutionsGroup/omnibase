# Performance test overrides - uses stripe-mock for load testing without rate limits
services:
  auth-migrate:
    image: ""
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth

  auth:
    image: ""
    build:
      context: ../../../docker/auth
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../../../docker/auth
        target: /etc/config/auth

  rest-api:
    image: ""
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    volumes:
      - ../../../apps/api:/app
    environment:
      - STRIPE_API_URL=http://stripe-mock:12111
      - ENABLE_PPROF=true
    depends_on:
      - stripe-mock
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"
    networks:
      - app-network

  permissions-migrate:
    image: ""
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile

  permissions:
    image: ""
    build:
      context: ../../../docker/permissions
      dockerfile: Dockerfile
