<div class="card w-full max-w-4xl" x-data="roleCreatorTree()">
  <header>
    <h2>
      <template x-if="isEditMode">
        <span x-html="'Edit Role: ' + roleName"></span>
      </template>
    </h2>
    <p>
      <template x-if="isEditMode">
        Update permissions for this existing role
      </template>
    </p>
  </header>
  <section>
    <div class="relative">
      <label class="label" for="role-name">Role Name</label>
      <input
        id="role-name"
        class="input"
        type="text"
        placeholder="Enter role name (e.g., admin, developer, viewer)"
        :value="roleName"
        @change="handleRoleName($event.target.value)"
        @focus="showSuggestionList()"
        @blur="hideSuggestionsSoon()"
      />
      <template x-if="showSuggestions && filteredSuggestions.length > 0">
        <div
          class="absolute z-10 mt-1 max-h-48 w-full overflow-y-auto rounded-md border bg-popover shadow-lg"
        >
          <template x-for="suggestion in filteredSuggestions">
            <button
              type="button"
              class="w-full px-4 py-2 text-left text-sm hover:bg-accent hover:text-accent-foreground"
              :key="suggestion"
              @mouse-down="selectSuggestion(suggestion)"
            >
              <span x-html="suggestion"></span>
            </button>
          </template>
        </div>
      </template>
      <template x-if="isEditMode">
        <p class="mt-1 text-xs text-amber-600 dark:text-amber-400">
          Editing existing role - changes will update all users with this role
        </p>
      </template>
    </div>
    <hr class="my-6 border-border" />
    <div class="space-y-4">
      <span class="label">Permissions</span>
      <div class="flex flex-col gap-2 sm:flex-row">
        <div class="field flex-1">
          <label class="label" for="permission-namespace">Namespace</label>
          <select
            id="permission-namespace"
            class="select"
            :value="selectedNamespace"
            @change="selectNamespace($event.target.value)"
          >
            <option value="">Select namespace...</option>
            <template x-for="definition in definitions">
              <option :key="definition.namespace" :value="definition.namespace">
                <span x-html="definition.namespace"></span>
              </option>
            </template>
          </select>
        </div>
        <template x-if="requiresObjectId">
          <div class="field flex-1">
            <label class="label" for="permission-object">Resource</label>
            <select
              id="permission-object"
              class="select"
              :value="selectedObjectId"
              @change="selectObject($event.target.value)"
              :disabled="availableObjects.length === 0"
            >
              <option value="">
                <template x-if="availableObjects.length === 0">
                  No resources available
                </template>
              </option>
              <template x-for="object in availableObjects">
                <option :key="object.id" :value="object.id">
                  <span x-html="object.label"></span>
                </option>
              </template>
            </select>
          </div>
        </template>
      </div>
      <template x-if="showTree">
        <div class="max-h-[400px] overflow-y-auto rounded-md border p-2">
          <template x-for="permission in grouped.ungrouped">
            <label
              class="flex cursor-pointer items-center gap-2.5 rounded px-2 py-1.5 hover:bg-muted/50"
              :key="permission.name"
            >
              <input
                type="checkbox"
                class="input"
                :checked="isSelected(permission.name)"
                @change="togglePermission(permission.name, $event.target.checked)"
              />
              <span class="text-sm text-foreground/90">
                <span x-html="permission.displayName"></span>
              </span>
            </label>
          </template>
          <template x-for="group in groupList">
            <div :key="group.name">
              <div
                class="mt-1 flex items-center gap-2 rounded bg-muted/30 px-2 py-2 first:mt-0 hover:bg-muted/50"
              >
                <button
                  type="button"
                  class="group rounded p-0.5 hover:bg-muted"
                  :aria-expanded="isGroupOpen(group.name)"
                  @click="toggleGroup(group.name)"
                >
                  <span
                    aria-hidden="true"
                    class="inline-block text-base leading-none text-foreground/70 transition-transform duration-200 group-aria-expanded:rotate-90"
                  >
                    ▸
                  </span>
                </button>
                <input
                  type="checkbox"
                  class="input"
                  :checked="isGroupChecked(group.allRelations)"
                  @change="togglePermissions(group.allRelations, $event.target.checked)"
                />
                <button
                  type="button"
                  :class="isGroupIndeterminate(group.allRelations) ? 'cursor-pointer select-none text-left text-sm font-semibold text-foreground/70' : 'cursor-pointer select-none text-left text-sm font-semibold text-foreground'"
                  @click="toggleGroup(group.name)"
                >
                  <span x-html="group.name"></span>
                </button>
              </div>
              <template x-if="isGroupOpen(group.name)">
                <template x-for="permission in group.permissions">
                  <label
                    class="flex cursor-pointer items-center gap-2.5 rounded py-1.5 pl-8 pr-2 hover:bg-muted/50"
                    :key="permission.name"
                  >
                    <input
                      type="checkbox"
                      class="input"
                      :checked="isSelected(permission.name)"
                      @change="togglePermission(permission.name, $event.target.checked)"
                    />
                    <span class="text-sm text-foreground/90">
                      <span x-html="permission.displayName"></span>
                    </span>
                  </label>
                </template>
                <template x-for="subGroup in group.subGroups">
                  <div :key="subGroup.name">
                    <div
                      class="flex items-center gap-2 rounded py-1.5 pl-8 pr-2 hover:bg-muted/50"
                    >
                      <button
                        type="button"
                        class="group rounded p-0.5 hover:bg-muted"
                        :aria-expanded="isGroupOpen(subGroupKey(group.name, subGroup.name))"
                        @click="toggleGroup(subGroupKey(group.name, subGroup.name))"
                      >
                        <span
                          aria-hidden="true"
                          class="inline-block text-xs leading-none text-muted-foreground transition-transform duration-200 group-aria-expanded:rotate-90"
                        >
                          ▸
                        </span>
                      </button>
                      <input
                        type="checkbox"
                        class="input"
                        :checked="isGroupChecked(subGroup.permissions.map(permission => permission.name))"
                        @change="togglePermissions(subGroup.permissions.map(permission => permission.name), $event.target.checked)"
                      />
                      <button
                        type="button"
                        class="cursor-pointer select-none text-left text-xs font-medium uppercase tracking-wider text-muted-foreground"
                        @click="toggleGroup(subGroupKey(group.name, subGroup.name))"
                      >
                        <span x-html="subGroup.name"></span>
                      </button>
                    </div>
                    <template
                      x-if="isGroupOpen(subGroupKey(group.name, subGroup.name))"
                    >
                      <template x-for="permission in subGroup.permissions">
                        <label
                          class="flex cursor-pointer items-center gap-2.5 rounded py-1.5 pl-14 pr-2 hover:bg-muted/50"
                          :key="permission.name"
                        >
                          <input
                            type="checkbox"
                            class="input"
                            :checked="isSelected(permission.name)"
                            @change="togglePermission(permission.name, $event.target.checked)"
                          />
                          <span class="text-sm text-foreground/90">
                            <span x-html="permission.displayName"></span>
                          </span>
                        </label>
                      </template>
                    </template>
                  </div>
                </template>
              </template>
            </div>
          </template>
        </div>
      </template>
      <template x-if="selectedPermissions.length > 0">
        <div class="rounded-md bg-muted p-3">
          <p class="mb-2 text-xs text-muted-foreground">
            <span
              x-html="'Selected permissions (' + selectedPermissions.length + '):'"
            ></span>
          </p>
          <ul class="space-y-1 font-mono text-xs">
            <template x-for="permission in selectedPermissions">
              <li class="text-muted-foreground" :key="permission">
                <span x-html="permission"></span>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </section>
  <footer class="flex items-center justify-end gap-3">
    <button type="button" class="btn" data-variant="outline" @click="reset()">
      Reset
    </button>
    <button type="button" class="btn" :disabled="!canSubmit" @click="submit()">
      <template x-if="isEditMode">Update Role</template>
    </button>
  </footer>
</div>
<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("roleCreatorTree", () => ({
      roleName: "",
      showSuggestions: false,
      isEditMode: false,
      editingRoleId: "",
      selectedNamespace: "",
      selectedObjectId: "",
      selectedPermissions: EMPTY_PERMISSIONS,
      openGroups: EMPTY_OPEN_GROUPS,
      buildOptions(namespace) {
        const ns = namespace.toLowerCase();
        const definition = (props.definitions || []).find(
          (item) => item.namespace.toLowerCase() === ns
        );
        if (!definition) return [];
        const metadata = definition.relationsMetadata;
        if (metadata && metadata.length > 0) {
          return metadata.map((relation) => ({
            name: relation.name,
            displayName: relation.displayName,
            group: relation.group || null,
            subGroup: relation.subGroup || null,
          }));
        }
        return (definition.relations || [])
          .filter(
            (relation) =>
              relation.indexOf("can_") === 0 || relation.indexOf("is_") === 0
          )
          .map((relation) => ({
            name: relation,
            displayName: formatRelation(relation),
            group: null,
            subGroup: null,
          }));
      },
      buildKey(relation) {
        return buildPermissionString(
          this.selectedNamespace,
          relation,
          this.selectedObjectId
        );
      },
      subGroupKey(groupName, subGroupName) {
        return groupName + ":" + subGroupName;
      },
      get roleSuggestions() {
        return (props.roles || []).map((role) => role.roleName);
      },
      get filteredSuggestions() {
        const query = this.roleName.toLowerCase();
        return this.roleSuggestions.filter(
          (suggestion) => suggestion.toLowerCase().indexOf(query) !== -1
        );
      },
      get permissions() {
        return this.buildOptions(this.selectedNamespace);
      },
      get grouped() {
        return groupPermissions(this.permissions);
      },
      get groupList() {
        return toGroupList(this.grouped);
      },
      get requiresObjectId() {
        return (
          this.selectedNamespace !== "" &&
          this.selectedNamespace.toLowerCase() !== "tenant"
        );
      },
      get availableObjects() {
        const map = props.namespaceMap || {};
        return map[this.selectedNamespace.toLowerCase()] || [];
      },
      get showTree() {
        return (
          this.selectedNamespace !== "" &&
          (!this.requiresObjectId || this.selectedObjectId !== "")
        );
      },
      get canSubmit() {
        return (
          this.roleName.trim().length > 0 && this.selectedPermissions.length > 0
        );
      },
      isSelected(relation) {
        return this.selectedPermissions.indexOf(this.buildKey(relation)) !== -1;
      },
      isGroupChecked(relations) {
        const selected = relations.filter((relation) =>
          this.isSelected(relation)
        );
        return relations.length > 0 && selected.length === relations.length;
      },
      isGroupIndeterminate(relations) {
        const selected = relations.filter((relation) =>
          this.isSelected(relation)
        );
        return selected.length > 0 && selected.length < relations.length;
      },
      isGroupOpen(key) {
        return this.openGroups.indexOf(key) !== -1;
      },
      toggleGroup(key) {
        if (this.openGroups.indexOf(key) === -1) {
          this.openGroups = this.openGroups.concat([key]);
        } else {
          this.openGroups = this.openGroups.filter((item) => item !== key);
        }
      },
      selectNamespace(namespace) {
        this.selectedNamespace = namespace;
        this.selectedObjectId = "";
        const groupedOptions = groupPermissions(this.buildOptions(namespace));
        const keys = [];
        Object.keys(groupedOptions.groups).forEach((groupName) => {
          keys.push(groupName);
          Object.keys(groupedOptions.groups[groupName].subGroups).forEach(
            (subName) => {
              keys.push(groupName + ":" + subName);
            }
          );
        });
        this.openGroups = keys;
      },
      selectObject(objectId) {
        this.selectedObjectId = objectId;
      },
      togglePermission(relation, checked) {
        const key = this.buildKey(relation);
        const next = this.selectedPermissions.filter((item) => item !== key);
        if (checked) next.push(key);
        this.selectedPermissions = next;
      },
      togglePermissions(relations, checked) {
        const keys = relations.map((relation) => this.buildKey(relation));
        if (checked) {
          const next = this.selectedPermissions.slice();
          keys.forEach((key) => {
            if (next.indexOf(key) === -1) next.push(key);
          });
          this.selectedPermissions = next;
        } else {
          this.selectedPermissions = this.selectedPermissions.filter(
            (item) => keys.indexOf(item) === -1
          );
        }
      },
      handleRoleName(value) {
        this.roleName = value;
        const match = (props.roles || []).find(
          (role) => role.roleName.toLowerCase() === value.toLowerCase()
        );
        if (match) {
          this.isEditMode = true;
          this.editingRoleId = match.id;
          this.selectedPermissions = match.permissions
            ? match.permissions.slice()
            : [];
        } else {
          this.isEditMode = false;
          this.editingRoleId = "";
        }
      },
      selectSuggestion(suggestion) {
        this.handleRoleName(suggestion);
        this.showSuggestions = false;
      },
      hideSuggestionsSoon() {
        setTimeout(() => {
          this.showSuggestions = false;
        }, 200);
      },
      showSuggestionList() {
        this.showSuggestions = true;
      },
      reset() {
        this.roleName = "";
        this.showSuggestions = false;
        this.isEditMode = false;
        this.editingRoleId = "";
        this.selectedNamespace = "";
        this.selectedObjectId = "";
        this.selectedPermissions = [];
        this.openGroups = [];
      },
      submit() {
        if (!this.canSubmit) return;
        const permissionStrings = this.selectedPermissions.slice();
        if (this.isEditMode && this.editingRoleId !== "") {
          if (props.onRoleUpdate) {
            props.onRoleUpdate({
              role_id: this.editingRoleId,
              role_name: this.roleName,
              permissions: permissionStrings,
            });
          }
        } else if (props.onRoleCreate) {
          props.onRoleCreate({
            role_name: this.roleName,
            permissions: permissionStrings,
          });
        }
      },
    }));
  });
</script>
