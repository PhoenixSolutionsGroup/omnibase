        upload_url:
          type: string
          description: Presigned URL for uploading the file (valid for 15 minutes)
          example: https://storage.test.example.com/bucket/path?signature=...
        path:
          type: string
          description: Confirmed storage path
          example: avatars/user-123.png
    ForbiddenResponse:
