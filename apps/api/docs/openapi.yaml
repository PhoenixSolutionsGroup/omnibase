  /api/v1/permissions/namespaces:
    post:
      operationId: deployPermissionNamespaces
      summary: Deploy Keto namespace configurations
      description: |
        Uploads and deploys permission namespace configurations as a zip file.

        ## Authentication
        Requires JWT token with appropriate permissions.

        ## File Format
        Upload a zip file containing namespace definition files and optionally a `roles.config.json` file.
        The namespace files are stored in S3 and parsed to extract permission definitions.

        **roles.config.json format:**
        ```json
        {
          "roles": [
            {
              "role": "admin",
              "permissions": ["projects:read", "projects:write", "projects:delete"]
            },
            {
              "role": "viewer",
              "permissions": ["projects:read"]
            }
          ]
        }
        ```

        ## Managed Mode
        If managed hosting is enabled, this endpoint will also trigger a restart of the Keto service.

        ## Use Cases
        - CLI namespace deployment via `omnibase permissions push`
        - CI/CD pipeline integrations
        - Programmatic permission management
      tags:
        - V1 Configuration
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - namespaces
              properties:
                namespaces:
                  type: string
                  format: binary
                  description: Zip file containing namespace configuration files
      responses:
        '200':
          description: Namespaces deployed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamespaceDeploymentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/storage/upload:
    post:
      operationId: uploadFile
      summary: Upload file to storage
      description: |
        Generates a presigned S3 upload URL with Row-Level Security (RLS) enforcement.

        ## Authentication
        - **Session Auth**: Requires JWT token via Cookie (`omnibase_postgrest_jwt`) or Header (`X-Postgrest-Token`)
        - **Service Key Auth**: Requires X-Service-Key + X-User-Id + X-Tenant-Id + X-Postgrest-Token headers

        ## RLS Policy
        Upload permission is checked via PostgREST against the `storage.objects` table.
        Users must have INSERT permission based on their custom RLS policies.

        ## Upload Process
        1. Request presigned URL from this endpoint
        2. Upload file directly to S3 using returned URL (PUT request)
        3. File metadata is automatically stored in database

        ## URL Expiration
        Presigned URLs are valid for 15 minutes after generation.
      tags:
        - V1 Storage
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      parameters:
        - in: header
          name: X-User-Id
          required: false
          schema:
            type: string
            format: uuid
          description: User ID (UUID) - Required when using X-Service-Key header
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
            format: uuid
          description: Tenant ID (UUID) - Required when using X-Service-Key header
        - in: header
          name: X-Postgrest-Token
          required: false
          schema:
            type: string
          description: PostgREST JWT token - Alternative to cookie authentication
        - in: cookie
          name: omnibase_postgrest_jwt
          required: false
          schema:
            type: string
          description: PostgREST JWT token in cookie form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Upload URL generated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: 400 Bad Request
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
