    delete:
      tags:
        - V1 Tenants
      summary: Remove tenant user
      description: |
        Removes a user from the tenant and cleans up all associated permissions and Keto relationships.

        ## Authentication
        Requires JWT token with `remove_user` permission.

        ## Restrictions
        - Cannot remove the last owner (must have at least one owner)
        - Removing an owner requires `remove_owner_role` permission

        ## Process
        1. Verifies permissions
        2. Removes from role's user list
        3. Deletes all Keto relationships
        4. Removes from database
        5. Cleans up user's tenant state
      operationId: removeTenantUser
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteTenantUserRequest'
      responses:
        '200':
          description: User removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: 400 Bad Request
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found in tenant
          content:
