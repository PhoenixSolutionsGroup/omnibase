    WebhookSecretResponse:
      type: object
      required:
        - id
        - stripe_id
        - url
        - secret
        - events
        - connect
      properties:
        id:
          type: string
          format: uuid
          description: Internal webhook ID
          example: e056fa27-151d-4d25-b237-97e9de8d8dbf
        stripe_id:
          type: string
          description: Stripe webhook endpoint ID
          example: we_1SRiyyCJIZaBlhY1
        url:
          type: string
          description: Webhook endpoint URL
          example: https://example.com/webhooks/stripe
        secret:
          type: string
          description: Webhook signing secret
          example: whsec_xxx
        events:
          type: array
          description: List of subscribed event types
          items:
            type: string
        connect:
          type: boolean
          description: Whether webhook listens to connected account events
          example: false
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
    WebhookEndpointConfig:
      type: object
      required:
        - url
        - events
      properties:
        id:
          type: string
          description: Optional unique identifier for the webhook endpoint
          example: account_events
        url:
          type: string
          format: uri
          description: Webhook endpoint URL (supports ${VAR} env var interpolation via CLI)
          example: https://example.com/webhooks/stripe
        events:
          type: array
          minItems: 1
          description: List of Stripe event types to subscribe to
          items:
            type: string
            enum:
              - account.updated
              - account.application.deauthorized
              - account.external_account.created
              - account.external_account.updated
              - account.external_account.deleted
              - payment_intent.created
              - payment_intent.succeeded
              - payment_intent.payment_failed
              - payment_intent.canceled
              - payment_intent.requires_action
              - charge.succeeded
              - charge.failed
              - charge.refunded
              - charge.captured
              - charge.dispute.created
              - charge.dispute.updated
              - charge.dispute.closed
              - customer.created
              - customer.updated
              - customer.deleted
              - customer.subscription.created
              - customer.subscription.updated
              - customer.subscription.deleted
              - customer.subscription.trial_will_end
              - customer.subscription.paused
              - customer.subscription.resumed
              - invoice.created
              - invoice.finalized
              - invoice.paid
              - invoice.payment_failed
              - invoice.payment_action_required
              - invoice.upcoming
              - invoice.marked_uncollectible
              - invoice.voided
              - payout.created
              - payout.paid
              - payout.failed
              - payout.canceled
              - product.created
              - product.updated
              - product.deleted
              - price.created
              - price.updated
              - price.deleted
              - checkout.session.completed
              - checkout.session.expired
              - checkout.session.async_payment_succeeded
              - checkout.session.async_payment_failed
              - refund.created
              - refund.updated
              - payment_method.attached
              - payment_method.detached
              - transfer.created
              - transfer.reversed
          example:
            - invoice.paid
            - customer.subscription.created
        connect:
          type: boolean
          default: false
          description: If true, listen to events from connected accounts (Stripe Connect)
          example: false
    WebhooksConfigRequest:
      type: object
      required:
        - webhooks
      properties:
        webhooks:
          type: array
          description: List of webhook endpoint configurations. Each webhook must have a unique URL - duplicate URLs are not allowed.
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEndpointConfig'
    WebhookResult:
      type: object
      required:
        - stripe_id
        - url
        - events
        - connect
        - secret
        - action
      properties:
        id:
          type: string
          description: Internal webhook ID
          example: e056fa27-151d-4d25-b237-97e9de8d8dbf
        stripe_id:
          type: string
          description: Stripe webhook endpoint ID (we_xxx) or managed pseudo ID (wh_managed_xxx)
          example: we_1SRiyyCJIZaBlhY1
        url:
          type: string
          description: Webhook endpoint URL
          example: https://example.com/webhooks/stripe
        events:
          type: array
          description: List of subscribed event types
          items:
            type: string
          example:
            - invoice.paid
        connect:
          type: boolean
          description: Whether webhook listens to connected account events
          example: false
        secret:
          type: string
          description: Webhook signing secret for signature verification
          example: whsec_xxx
        action:
          type: string
          description: Action performed on the webhook
          enum:
            - created
            - updated
            - unchanged
          example: created
    WebhooksConfigResponse:
      type: object
      required:
