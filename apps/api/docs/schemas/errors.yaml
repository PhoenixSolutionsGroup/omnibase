# openapi: 3.1.0

components:
  schemas:
    ErrorResponse:
      type: object
      description: Generic error response
      properties:
        error:
          type: string
          description: Error message or details
          example: An error occurred
      required:
        - error

    BadRequest:
      type: object
      description: Bad Request error response (400)
      properties:
        error:
          type: string
          description: Error message or details
          example: Invalid request parameters
      required:
        - error

    BadRequestResponse:
      type: object
      description: Bad Request error response (400)
      properties:
        error:
          type: string
          description: Error message or details
          example: Invalid request parameters
      required:
        - error

    Unauthorized:
      type: object
      description: Unauthorized error response (401)
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized
      required:
        - error

    UnauthorizedResponse:
      type: object
      description: Unauthorized error response (401)
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized
      required:
        - error

    ForbiddenResponse:
      type: object
      description: Forbidden error response (403)
      properties:
        error:
          type: string
          description: Error message
          example: Forbidden
      required:
        - error

    NotFound:
      type: object
      description: Not Found error response (404)
      properties:
        error:
          type: string
          description: Error message
          example: Not Found
      required:
        - error

    NotFoundResponse:
      type: object
      description: Not Found error response (404)
      properties:
        error:
          type: string
          description: Error message
          example: Not Found
      required:
        - error

    InternalServerError:
      type: object
      description: Internal Server Error response (500)
      properties:
        error:
          type: string
          description: Error message
          example: Internal Server Error
      required:
        - error

    InternalServerErrorResponse:
      type: object
      description: Internal Server Error response (500)
      properties:
        error:
          type: string
          description: Error message
          example: Internal Server Error
      required:
        - error

    ConflictResponse:
      type: object
      description: Conflict error response (409)
      properties:
        error:
          type: string
          description: Error message
          example: Conflict
      required:
        - error

    TooManyRequestsResponse:
      type: object
      description: Too Many Requests error response (429)
      properties:
        error:
          type: string
          description: Error message
          example: Too Many Requests
      required:
        - error

  responses:
    BadRequestError:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestResponse'
        text/plain:
          schema:
            type: string
            example: "400 Bad Request"

    UnauthorizedError:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedResponse'

    ForbiddenError:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenResponse'

    NotFoundError:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'

    ConflictError:
      description: Conflict - Resource already exists or conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictResponse'

    TooManyRequestsError:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsResponse'

    InternalServerError:
      description: Internal Server Error - Server encountered an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorResponse'
