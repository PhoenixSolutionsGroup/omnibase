components:
  schemas:
    EventsWebSocketInfo:
      type: object
      description: WebSocket connection information for real-time database events
      properties:
        connection_url:
          type: string
          description: WebSocket connection URL
          example: ws://api.test.example.com/api/v1/events
        protocol:
          type: string
          description: WebSocket protocol
          example: WebSocket
        description:
          type: string
          description: Connection description
          example: Connect to receive real-time database change notifications with RLS enforcement