components:
  schemas:
    MigrationSuccessResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 200
        message:
          type: string
          description: Success message
          example: Migrations applied successfully

    MigrationErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        message:
          type: string
          description: Error message
          example: No migrations zip file provided

    AppliedMigration:
      type: object
      required:
        - version
        - dirty
      properties:
        version:
          type: integer
          format: int64
          description: Migration version number
          example: 18
        dirty:
          type: boolean
          description: Whether the migration is in a dirty (failed) state requiring manual repair
          example: false