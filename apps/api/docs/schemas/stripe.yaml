components:
  schemas:
    # Shared Enums
    CurrencyCode:
      type: string
      description: Three-letter ISO currency code (lowercase)
      enum:
        - usd
        - eur
        - gbp
        - cad
        - aud
        - jpy
        - inr
        - brl
        - mxn
        - sgd
        - hkd
        - nzd
        - chf
        - sek
        - dkk
        - nok
        - pln
        - czk
        - ils
        - zar
      example: "usd"

    BillingInterval:
      type: string
      description: Billing interval for recurring prices
      enum:
        - day
        - week
        - month
        - year
      example: "month"

    UsageType:
      type: string
      description: Usage type for recurring prices
      enum:
        - licensed
        - metered
      example: "licensed"

    PerUnitBillingScheme:
      type: string
      description: Billing scheme type for per-unit pricing
      enum:
        - per_unit
      default: "per_unit"
      example: "per_unit"

    TieredBillingScheme:
      type: string
      description: Billing scheme type for tiered pricing
      enum:
        - tiered
      example: "tiered"

    TiersMode:
      type: string
      description: Tiers mode for tiered pricing
      enum:
        - graduated
        - volume
      example: "graduated"

    # Main Configuration Models
    StripeConfiguration:
      type: object
      required:
        - version
        - products
      properties:
        version:
          type: string
          description: Configuration version in semantic versioning format
          example: "1.0.0"
        meters:
          type: array
          description: List of billing meters for metered pricing (required when any price uses usage_type metered)
          items:
            $ref: '#/components/schemas/Meter'
        products:
          type: array
          description: List of products with their prices
          items:
            $ref: '#/components/schemas/Product'

    StripeConfigurationWithIDs:
      type: object
      required:
        - version
        - products
      properties:
        version:
          type: string
          description: Configuration version
          example: "1.0.0"
        meters:
          type: array
          description: List of billing meters with Stripe IDs
          items:
            $ref: '#/components/schemas/MeterWithStripeID'
        products:
          type: array
          description: List of products with Stripe IDs
          items:
            $ref: '#/components/schemas/ProductWithStripeIDs'

    # Product Models
    Product:
      type: object
      required:
        - id
        - name
        - prices
      properties:
        id:
          type: string
          minLength: 1
          description: Product identifier (config ID)
          example: "basic_plan"
        stripe_id:
          type: string
          description: Original Stripe ID for migration support (optional, used to link existing Stripe products)
          example: "prod_1SRiyyCJIZaBlhY1"
        name:
          type: string
          minLength: 1
          description: Product name
          example: "Basic Plan"
        description:
          type: string
          description: Product description
          example: "Our basic subscription tier"
        type:
          type: string
          description: Product type
          enum:
            - service
            - good
            - metered
          example: "service"
        prices:
          type: array
          minItems: 1
          description: List of prices for this product
          items:
            $ref: '#/components/schemas/Price'
        ui:
          $ref: '#/components/schemas/ProductUI'

    ProductWithStripeIDs:
      type: object
      required:
        - id
        - name
        - prices
      properties:
        id:
          type: string
          minLength: 1
          description: Product identifier (config ID)
          example: "basic_plan"
        name:
          type: string
          minLength: 1
          description: Product name
          example: "Basic Plan"
        description:
          type: string
          description: Product description
          example: "Our basic subscription tier"
        type:
          type: string
          description: Product type
          enum:
            - service
            - good
            - metered
          example: "service"
        prices:
          type: array
          minItems: 1
          description: List of prices with Stripe IDs
          items:
            $ref: '#/components/schemas/PriceWithStripeID'
        ui:
          $ref: '#/components/schemas/ProductUI'
        stripe_id:
          type: string
          nullable: true
          description: Actual Stripe product ID (null for free products)
          example: "prod_1SRiyyCJIZaBlhY1"

    # Price Models
    Price:
      oneOf:
        - $ref: '#/components/schemas/PerUnitPrice'
        - $ref: '#/components/schemas/TieredPrice'

    PerUnitPrice:
      type: object
      required:
        - id
        - currency
        - amount
      properties:
        id:
          type: string
          minLength: 1
          description: Price identifier (config ID)
          example: "basic_monthly"
        stripe_id:
          type: string
          description: Original Stripe ID for migration support (optional, used to link existing Stripe prices)
          example: "price_1SRiyyCJIZaBlhY1NpAJFhNU"
        public:
          type: boolean
          nullable: true
          description: Whether price is visible in public API (null/true = public, false = enterprise only)
          example: true
        tax_included_in_price:
          type: boolean
          nullable: true
          description: Whether tax is included in the price (null/false = exclusive)
          example: false
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Price amount in smallest currency unit (e.g., cents) - minimum $0.01 per Stripe requirements
          example: 1999
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        interval:
          allOf:
            - $ref: '#/components/schemas/BillingInterval'
            - description: Billing interval for recurring prices (required when usage_type is metered)
        interval_count:
          type: integer
          description: Number of intervals between billings (default 1)
          example: 1
        usage_type:
          allOf:
            - $ref: '#/components/schemas/UsageType'
            - description: Usage type for recurring prices (when set to metered, interval and meter are required)
        meter:
          type: string
          minLength: 1
          description: Meter ID for metered pricing (required when usage_type is metered, must reference a meter defined in the meters array)
          example: "api_requests"
        billing_scheme:
          $ref: '#/components/schemas/PerUnitBillingScheme'
        default:
          type: boolean
          description: Mark as default price for the product
          example: false
        ui:
          $ref: '#/components/schemas/PriceUI'
      anyOf:
        - not:
            properties:
              usage_type:
                const: metered
        - required:
            - interval
            - meter

    TieredPrice:
      type: object
      required:
        - id
        - currency
        - billing_scheme
        - tiers_mode
        - tiers
      properties:
        id:
          type: string
          minLength: 1
          description: Price identifier (config ID)
          example: "basic_monthly_tiered"
        stripe_id:
          type: string
          description: Original Stripe ID for migration support (optional, used to link existing Stripe prices)
          example: "price_1SRiyyCJIZaBlhY1NpAJFhNU"
        public:
          type: boolean
          nullable: true
          description: Whether price is visible in public API (null/true = public, false = enterprise only)
          example: true
        tax_included_in_price:
          type: boolean
          nullable: true
          description: Whether tax is included in the price (null/false = exclusive)
          example: false
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        interval:
          allOf:
            - $ref: '#/components/schemas/BillingInterval'
            - description: Billing interval for recurring prices (required when usage_type is metered)
        interval_count:
          type: integer
          description: Number of intervals between billings (default 1)
          example: 1
        usage_type:
          allOf:
            - $ref: '#/components/schemas/UsageType'
            - description: Usage type for recurring prices (when set to metered, interval and meter are required)
        meter:
          type: string
          minLength: 1
          description: Meter ID for metered pricing (required when usage_type is metered, must reference a meter defined in the meters array)
          example: "api_requests"
        billing_scheme:
          $ref: '#/components/schemas/TieredBillingScheme'
        tiers_mode:
          $ref: '#/components/schemas/TiersMode'
        tiers:
          type: array
          description: Pricing tiers
          minItems: 1
          items:
            $ref: '#/components/schemas/Tier'
        default:
          type: boolean
          description: Mark as default price for the product
          example: false
        ui:
          $ref: '#/components/schemas/PriceUI'
      anyOf:
        - not:
            properties:
              usage_type:
                const: metered
        - required:
            - interval
            - meter

    PriceWithStripeID:
      type: object
      required:
        - id
        - currency
      properties:
        id:
          type: string
          minLength: 1
          description: Price identifier (config ID)
          example: "basic_monthly"
        public:
          type: boolean
          nullable: true
          description: Whether price is visible in public API
          example: true
        tax_included_in_price:
          type: boolean
          nullable: true
          description: Whether tax is included in the price
          example: false
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Price amount in smallest currency unit
          example: 1999
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        interval:
          $ref: '#/components/schemas/BillingInterval'
        interval_count:
          type: integer
          description: Number of intervals between billings
          example: 1
        usage_type:
          $ref: '#/components/schemas/UsageType'
        meter:
          type: string
          description: Meter ID for metered pricing
          example: "api_requests"
        billing_scheme:
          type: string
          nullable: true
          description: Billing scheme type
          example: "per_unit"
        tiers_mode:
          type: string
          nullable: true
          description: Tiers mode
          example: "graduated"
        tiers:
          type: array
          description: Pricing tiers
          items:
            $ref: '#/components/schemas/Tier'
        default:
          type: boolean
          description: Mark as default price
          example: false
        ui:
          $ref: '#/components/schemas/PriceUI'
        stripe_id:
          type: string
          nullable: true
          description: Actual Stripe price ID (null for free prices)
          example: "price_1SRiyyCJIZaBlhY1NpAJFhNU"

    # Tier Model
    Tier:
      type: object
      properties:
        up_to:
          oneOf:
            - type: integer
              description: Upper limit of this tier
            - type: string
              enum:
                - inf
              description: Infinite tier (last tier)
          example: 100
        flat_amount:
          type: integer
          format: int64
          nullable: true
          description: Flat fee for this tier
          example: 0
        unit_amount:
          type: integer
          format: int64
          nullable: true
          description: Per-unit price for this tier
          example: 10

    # Meter Models
    Meter:
      type: object
      required:
        - id
        - display_name
        - event_name
        - default_aggregation
      properties:
        id:
          type: string
          minLength: 1
          description: Meter identifier (config ID)
          example: "api_requests"
        stripe_id:
          type: string
          description: Original Stripe ID for migration support (optional, used to link existing Stripe meters)
          example: "mtr_1SRiyyCJIZaBlhY1"
        display_name:
          type: string
          minLength: 1
          description: Human-readable meter name
          example: "API Requests"
        event_name:
          type: string
          minLength: 1
          description: Event name to track for this meter
          example: "api_request"
        default_aggregation:
          $ref: '#/components/schemas/MeterDefaultAggregation'
        customer_mapping:
          $ref: '#/components/schemas/MeterCustomerMapping'
        value_settings:
          $ref: '#/components/schemas/MeterValueSettings'

    MeterWithStripeID:
      type: object
      required:
        - id
        - display_name
        - event_name
        - default_aggregation
      properties:
        id:
          type: string
          minLength: 1
          description: Meter identifier (config ID)
          example: "api_requests"
        display_name:
          type: string
          minLength: 1
          description: Human-readable meter name
          example: "API Requests"
        event_name:
          type: string
          minLength: 1
          description: Event name to track
          example: "api_request"
        default_aggregation:
          $ref: '#/components/schemas/MeterDefaultAggregation'
        customer_mapping:
          $ref: '#/components/schemas/MeterCustomerMapping'
        value_settings:
          $ref: '#/components/schemas/MeterValueSettings'
        stripe_id:
          type: string
          nullable: true
          description: Actual Stripe meter ID
          example: "mtr_1SRiyyCJIZaBlhY1"

    MeterDefaultAggregation:
      type: object
      required:
        - formula
      properties:
        formula:
          type: string
          description: Aggregation formula for meter events
          enum:
            - sum
            - count
            - last
          example: "sum"

    MeterCustomerMapping:
      type: object
      required:
        - event_payload_key
        - type
      properties:
        event_payload_key:
          type: string
          minLength: 1
          description: Key in event payload to identify customer (must be different from value_settings.event_payload_key)
          example: "customer_id"
        type:
          type: string
          description: Mapping type
          enum:
            - by_id
          example: "by_id"

    MeterValueSettings:
      type: object
      required:
        - event_payload_key
      properties:
        event_payload_key:
          type: string
          minLength: 1
          description: Key in event payload containing the usage value (must be different from customer_mapping.event_payload_key)
          example: "value"

    # UI Models
    ProductUI:
      type: object
      properties:
        display_name:
          type: string
          description: Display name for UI
          example: "Professional"
        tagline:
          type: string
          description: Short tagline
          example: "For growing teams"
        features:
          type: array
          description: List of product features
          items:
            type: string
          example:
            - "Unlimited projects"
            - "Priority support"
        badge:
          type: string
          description: Badge text (e.g., "Popular", "Best Value")
          example: "Popular"
        cta_text:
          type: string
          description: Call-to-action button text
          example: "Get Started"
        highlighted:
          type: boolean
          description: Whether to highlight this product
          example: true
        sort_order:
          type: integer
          description: Display order for sorting
          example: 1

    PriceUI:
      type: object
      properties:
        display_name:
          type: string
          description: Display name for this price tier
          example: "Monthly"
        price_display:
          $ref: '#/components/schemas/PriceDisplay'
        billing_period:
          type: string
          description: Human-readable billing period
          example: "per month"
        features:
          type: array
          description: Features specific to this price
          items:
            type: string
          example:
            - "Billed monthly"
        limits:
          type: array
          description: Usage limits for this price
          items:
            $ref: '#/components/schemas/PriceLimit'

    PriceDisplay:
      type: object
      properties:
        custom_text:
          type: string
          description: Custom text to display instead of price
          example: "Contact us"
        show_currency:
          type: boolean
          nullable: true
          description: Whether to show currency symbol
          example: true
        suffix:
          type: string
          description: Text to append after price
          example: "/mo"

    PriceLimit:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Limit description
          example: "Up to 1000 API calls"
        value:
          type: number
          format: double
          nullable: true
          description: Numeric limit value
          example: 1000
        unit:
          type: string
          description: Unit of measurement
          example: "requests"

    # Response Models
    StripeConfigResponse:
      type: object
      required:
        - id
        - config
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Configuration ID
          example: "e056fa27-151d-4d25-b237-97e9de8d8dbf"
        config:
          $ref: '#/components/schemas/StripeConfigurationWithIDs'
        version:
          type: string
          description: Configuration version
          example: "1.0.0"
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-11-10T00:29:19Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-11-10T00:29:19Z"

    ConfigHistoryResponse:
      type: object
      required:
        - configs
        - pagination
      properties:
        configs:
          type: array
          description: List of configuration entries
          items:
            $ref: '#/components/schemas/ConfigHistoryItem'
        pagination:
          $ref: '#/components/schemas/ConfigHistoryPagination'

    ConfigHistoryItem:
      type: object
      required:
        - id
        - config
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Configuration ID
          example: "e056fa27-151d-4d25-b237-97e9de8d8dbf"
        config:
          $ref: '#/components/schemas/StripeConfigurationWithIDs'
        version:
          type: string
          description: Configuration version
          example: "1.0.0"
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-11-10T00:29:19Z"
        updated_at:
          type: string
          format: date-time
          description: Update timestamp
          example: "2025-11-10T00:29:19Z"
        parse_error:
          type: string
          nullable: true
          description: Parse error if configuration is invalid
          example: "Invalid product configuration"

    ConfigHistoryPagination:
      type: object
      required:
        - total
        - page
        - per_page
        - total_pages
        - has_next
        - has_prev
      properties:
        total:
          type: integer
          format: int64
          description: Total number of configurations
          example: 2
        page:
          type: integer
          description: Current page number
          example: 1
        per_page:
          type: integer
          description: Items per page
          example: 10
        total_pages:
          type: integer
          description: Total pages
          example: 1
        has_next:
          type: boolean
          description: Whether there is a next page
          example: false
        has_prev:
          type: boolean
          description: Whether there is a previous page
          example: false

    StripeIDConversionResponse:
      type: object
      required:
        - stripe_id
        - config_id
        - item_type
        - config_uuid
        - history_count
      properties:
        stripe_id:
          type: string
          description: Stripe ID
          example: "price_1SRiyyCJIZaBlhY1NpAJFhNU"
        config_id:
          type: string
          description: Config ID
          example: "price_test_basic_monthly"
        item_type:
          type: string
          description: Item type (product, price, or meter)
          enum:
            - product
            - price
            - meter
          example: "price"
        config_uuid:
          type: string
          format: uuid
          description: Configuration UUID that this mapping belongs to
          example: "e056fa27-151d-4d25-b237-97e9de8d8dbf"
        history_count:
          type: integer
          description: Number of historical Stripe IDs for this config item
          example: 1

    ArchiveAllResponse:
      type: object
      required:
        - message
        - archived_items
        - archive_errors
        - total_archived
        - total_errors
      properties:
        message:
          type: string
          description: Success message
          example: "Successfully archived all Stripe resources and cleared local config"
        archived_items:
          type: array
          description: List of successfully archived items
          items:
            type: string
          example:
            - "product: prod_123 (Basic Plan)"
            - "price: price_456"
        archive_errors:
          type: array
          description: List of items that failed to archive
          items:
            type: string
          example: []
        total_archived:
          type: integer
          description: Total number of archived items
          example: 15
        total_errors:
          type: integer
          description: Total number of errors
          example: 0
        warning:
          type: string
          nullable: true
          description: Warning message if there were errors
          example: "Some items failed to archive - see archive_errors for details"

    # Request Models
    StripeConfigUpdateRequest:
      type: object
      required:
        - version
        - products
      properties:
        version:
          type: string
          description: Configuration version (required, semantic version format)
          pattern: '^\d+\.\d+\.\d+$'
          example: "1.0.0"
        meters:
          type: array
          description: List of billing meters (optional array, items must be valid meter objects)
          items:
            $ref: '#/components/schemas/Meter'
        products:
          type: array
          description: List of products (required array, items must be valid product objects with id, name, and prices)
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'

    StripeConfigValidateRequest:
      type: object
      required:
        - version
        - products
      properties:
        version:
          type: string
          description: Configuration version (required, semantic version format)
          pattern: '^\d+\.\d+\.\d+$'
          example: "1.0.0"
        meters:
          type: array
          description: List of billing meters (optional array, items must be valid meter objects)
          items:
            $ref: '#/components/schemas/Meter'
        products:
          type: array
          description: List of products (required array, items must be valid product objects with id, name, and prices)
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'

    # Webhook Models
    WebhooksConfigRequest:
      type: object
      required:
        - webhooks
      properties:
        webhooks:
          type: array
          description: List of webhook endpoint configurations
          items:
            $ref: '#/components/schemas/WebhookEndpointConfig'

    WebhookEndpointConfig:
      type: object
      required:
        - url
        - events
      properties:
        id:
          type: string
          description: Optional unique identifier for the webhook endpoint
          example: "account_events"
        url:
          type: string
          format: uri
          description: Webhook endpoint URL (supports ${VAR} env var interpolation via CLI)
          example: "https://example.com/webhooks/stripe"
        events:
          type: array
          minItems: 1
          description: List of Stripe event types to subscribe to
          items:
            type: string
          example:
            - "invoice.paid"
            - "customer.subscription.created"
        connect:
          type: boolean
          default: false
          description: If true, listen to events from connected accounts (Stripe Connect)
          example: false

    WebhooksConfigResponse:
      type: object
      required:
        - webhooks
      properties:
        webhooks:
          type: array
          description: List of configured webhook endpoints with results
          items:
            $ref: '#/components/schemas/WebhookResult'

    WebhookResult:
      type: object
      required:
        - stripe_id
        - url
        - events
        - connect
        - secret
        - action
      properties:
        id:
          type: string
          description: Internal webhook ID
          example: "e056fa27-151d-4d25-b237-97e9de8d8dbf"
        stripe_id:
          type: string
          description: Stripe webhook endpoint ID (we_xxx) or managed pseudo ID (wh_managed_xxx)
          example: "we_1SRiyyCJIZaBlhY1"
        url:
          type: string
          description: Webhook endpoint URL
          example: "https://example.com/webhooks/stripe"
        events:
          type: array
          description: List of subscribed event types
          items:
            type: string
          example:
            - "invoice.paid"
        connect:
          type: boolean
          description: Whether webhook listens to connected account events
          example: false
        secret:
          type: string
          description: Webhook signing secret for signature verification
          example: "whsec_xxx"
        action:
          type: string
          description: Action performed on the webhook
          enum:
            - created
            - updated
            - unchanged
          example: "created"

    WebhookSecretResponse:
      type: object
      required:
        - id
        - stripe_id
        - url
        - secret
        - events
        - connect
      properties:
        id:
          type: string
          format: uuid
          description: Internal webhook ID
          example: "e056fa27-151d-4d25-b237-97e9de8d8dbf"
        stripe_id:
          type: string
          description: Stripe webhook endpoint ID
          example: "we_1SRiyyCJIZaBlhY1"
        url:
          type: string
          description: Webhook endpoint URL
          example: "https://example.com/webhooks/stripe"
        secret:
          type: string
          description: Webhook signing secret
          example: "whsec_xxx"
        events:
          type: array
          description: List of subscribed event types
          items:
            type: string
        connect:
          type: boolean
          description: Whether webhook listens to connected account events
          example: false
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp