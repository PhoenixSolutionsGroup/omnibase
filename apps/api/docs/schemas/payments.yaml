components:
  schemas:
    CreateCheckoutRequest:
      type: object
      required:
        - price_id
        - success_url
        - cancel_url
      properties:
        price_id:
          type: string
          minLength: 1
          description: The price ID from your Stripe configuration (required, cannot be empty)
          example: price_test_basic
        success_url:
          type: string
          minLength: 1
          description: URL to redirect to after successful checkout (required, cannot be empty)
          example: https://test.example.com/success
        cancel_url:
          type: string
          minLength: 1
          description: URL to redirect to if checkout is cancelled (required, cannot be empty)
          example: https://test.example.com/cancel
        trial_period_days:
          type: integer
          description: Optional trial period in days
          example: 14
        promotion_code:
          type: string
          description: Optional promotion code to apply
          example: SUMMER2024
        allow_promotion_codes:
          type: boolean
          description: Whether to allow promotion codes to be entered
          example: true

    CreateCheckoutResponse:
      type: object
      required:
        - url
        - session_id
      properties:
        url:
          type: string
          description: Stripe Checkout Session URL
          example: https://checkout.stripe.com/pay/cs_test_...
        session_id:
          type: string
          description: Stripe Checkout Session ID
          example: cs_test_a1b2c3d4e5f6

    CreatePortalRequest:
      type: object
      required:
        - return_url
      properties:
        return_url:
          type: string
          format: uri
          minLength: 1
          description: URL to redirect to after leaving the portal (required, cannot be empty)
          example: https://test.example.com/dashboard

    CreatePortalResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Stripe Customer Portal URL
          example: https://billing.stripe.com/session/live_...

    RecordUsageRequest:
      type: object
      required:
        - meter_event_name
        - value
      properties:
        meter_event_name:
          type: string
          minLength: 1
          description: The meter event name as defined in your Stripe configuration (required, cannot be empty)
          example: api_requests
        value:
          type: string
          minLength: 1
          description: The usage value to record (required, cannot be empty)
          example: "100"

    CreateInvoiceRequest:
      type: object
      required:
        - currency
      additionalProperties: false
      properties:
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'
        auto_advance:
          type: boolean
          description: Whether to auto-advance the invoice (send immediately after finalization)
          example: false
        collection_method:
          type: string
          enum:
            - charge_automatically
            - send_invoice
          description: How to collect payment. `charge_automatically` (default) attempts to charge the customer's default payment method. `send_invoice` emails the customer (requires `days_until_due`).
          example: send_invoice
        days_until_due:
          type: integer
          minimum: 0
          maximum: 365
          description: Days until invoice is due. Required when `collection_method` is `send_invoice`.
          example: 7
        description:
          type: string
          description: Optional description for the invoice
          example: Monthly platform fees
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 40
          description: Optional metadata key-value pairs (keys must be alphanumeric/underscore, max 40 chars; values max 500 chars)

    UpdateInvoiceRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: Optional description to set on the invoice
          example: Monthly subscription - January 2025
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 40
          description: Optional metadata key-value pairs (keys must be alphanumeric/underscore, max 40 chars; values max 500 chars)

    AddInvoiceLineItemRequest:
      type: object
      required:
        - amount
        - description
        - currency
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999999999
          description: Amount in cents (required, must be positive, max ~$999B)
          example: 1000
        description:
          type: string
          minLength: 1
          description: Description for the line item (required)
          example: Platform fee
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'

    # Line item request using config price ID
    AddInvoiceLineItemWithConfigPriceRequest:
      type: object
      required:
        - price_id
        - quantity
        - description
        - currency
      additionalProperties: false
      properties:
        price_id:
          type: string
          minLength: 1
          description: Config price ID (e.g., "hetzner_cx23_nbg1_hourly") - looked up via GetStripeIDByConfigID
          example: hetzner_cx23_nbg1_hourly
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999999999
          description: Quantity of units (required, must be at least 1)
          example: 720
        description:
          type: string
          minLength: 1
          description: Description for the line item (required)
          example: VPS Compute - 720 hours
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 40
          description: Optional metadata key-value pairs (keys must be alphanumeric/underscore, max 40 chars; values max 500 chars)

    # Line item request using raw Stripe price ID
    AddInvoiceLineItemWithStripePriceRequest:
      type: object
      required:
        - stripe_price_id
        - quantity
        - description
        - currency
      additionalProperties: false
      properties:
        stripe_price_id:
          type: string
          pattern: '^price_[A-Za-z0-9]+$'
          description: Raw Stripe price ID (e.g., "price_1ABC...") - used directly
          example: price_1ABC123
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999999999
          description: Quantity of units (required, must be at least 1)
          example: 720
        description:
          type: string
          minLength: 1
          description: Description for the line item (required)
          example: VPS Compute - 720 hours
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 40
          description: Optional metadata key-value pairs (keys must be alphanumeric/underscore, max 40 chars; values max 500 chars)

    AddInvoiceLineItemWithPriceIDRequest:
      description: Add a line item using either a config price_id or raw stripe_price_id
      oneOf:
        - $ref: '#/components/schemas/AddInvoiceLineItemWithConfigPriceRequest'
        - $ref: '#/components/schemas/AddInvoiceLineItemWithStripePriceRequest'

    FinalizeInvoiceRequest:
      type: object
      properties:
        auto_advance:
          type: boolean
          description: Whether to auto-advance the invoice (send immediately)
          example: true

    InvoiceResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Stripe Invoice ID
          example: in_1234567890
        status:
          type: string
          description: Invoice status
          example: draft
        amount_due:
          type: integer
          format: int64
          description: Total amount in cents
          example: 2000
        currency:
          type: string
          description: Currency
          example: usd
        customer_id:
          type: string
          description: Customer ID
          example: cus_1234567890
        invoice_pdf:
          type: string
          description: Invoice PDF URL (if available)
          example: https://pay.stripe.com/invoice/...
        hosted_invoice_url:
          type: string
          description: Hosted invoice URL
          example: https://invoice.stripe.com/i/...

    InvoiceLineItemResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Stripe Invoice Item ID
          example: ii_1234567890
        amount:
          type: integer
          format: int64
          description: Amount in cents
          example: 1000
        description:
          type: string
          description: Description
          example: Platform fee