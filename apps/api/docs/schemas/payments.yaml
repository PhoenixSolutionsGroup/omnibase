components:
  schemas:
    CreateCheckoutRequest:
      type: object
      required:
        - price_id
        - success_url
        - cancel_url
      properties:
        price_id:
          type: string
          minLength: 1
          description: The price ID from your Stripe configuration (required, cannot be empty)
          example: price_test_basic
        success_url:
          type: string
          minLength: 1
          description: URL to redirect to after successful checkout (required, cannot be empty)
          example: https://test.example.com/success
        cancel_url:
          type: string
          minLength: 1
          description: URL to redirect to if checkout is cancelled (required, cannot be empty)
          example: https://test.example.com/cancel
        trial_period_days:
          type: integer
          description: Optional trial period in days
          example: 14
        promotion_code:
          type: string
          description: Optional promotion code to apply
          example: SUMMER2024
        allow_promotion_codes:
          type: boolean
          description: Whether to allow promotion codes to be entered
          example: true

    CreateCheckoutResponse:
      type: object
      required:
        - url
        - session_id
      properties:
        url:
          type: string
          description: Stripe Checkout Session URL
          example: https://checkout.stripe.com/pay/cs_test_...
        session_id:
          type: string
          description: Stripe Checkout Session ID
          example: cs_test_a1b2c3d4e5f6

    CreatePortalRequest:
      type: object
      required:
        - return_url
      properties:
        return_url:
          type: string
          format: uri
          minLength: 1
          description: URL to redirect to after leaving the portal (required, cannot be empty)
          example: https://test.example.com/dashboard

    CreatePortalResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Stripe Customer Portal URL
          example: https://billing.stripe.com/session/live_...

    RecordUsageRequest:
      type: object
      required:
        - meter_event_name
        - value
      properties:
        meter_event_name:
          type: string
          minLength: 1
          description: The meter event name as defined in your Stripe configuration (required, cannot be empty)
          example: api_requests
        value:
          type: string
          minLength: 1
          description: The usage value to record (required, cannot be empty)
          example: "100"

    CreateInvoiceRequest:
      type: object
      required:
        - currency
      properties:
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'
        auto_advance:
          type: boolean
          description: Whether to auto-advance the invoice (send immediately after finalization)
          example: false
        description:
          type: string
          description: Optional description for the invoice
          example: Monthly platform fees
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata key-value pairs

    UpdateInvoiceRequest:
      type: object
      properties:
        description:
          type: string
          description: Optional description to set on the invoice
          example: Monthly subscription - January 2025
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata key-value pairs to add

    AddInvoiceLineItemRequest:
      type: object
      required:
        - amount
        - description
        - currency
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in cents (required)
          example: 1000
        description:
          type: string
          minLength: 1
          description: Description for the line item (required)
          example: Platform fee
        currency:
          $ref: 'stripe.yaml#/components/schemas/CurrencyCode'

    FinalizeInvoiceRequest:
      type: object
      properties:
        auto_advance:
          type: boolean
          description: Whether to auto-advance the invoice (send immediately)
          example: true

    InvoiceResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Stripe Invoice ID
          example: in_1234567890
        status:
          type: string
          description: Invoice status
          example: draft
        amount_due:
          type: integer
          format: int64
          description: Total amount in cents
          example: 2000
        currency:
          type: string
          description: Currency
          example: usd
        customer_id:
          type: string
          description: Customer ID
          example: cus_1234567890
        invoice_pdf:
          type: string
          description: Invoice PDF URL (if available)
          example: https://pay.stripe.com/invoice/...
        hosted_invoice_url:
          type: string
          description: Hosted invoice URL
          example: https://invoice.stripe.com/i/...

    InvoiceLineItemResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Stripe Invoice Item ID
          example: ii_1234567890
        amount:
          type: integer
          format: int64
          description: Amount in cents
          example: 1000
        description:
          type: string
          description: Description
          example: Platform fee