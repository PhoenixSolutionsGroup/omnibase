paths:
  /api/v1/storage/upload:
    post:
      operationId: uploadFile
      summary: Upload file to storage
      description: |
        Generates a presigned S3 upload URL with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Upload permission is checked via PostgREST against the `storage.objects` table.
        Users must have INSERT permission based on their custom RLS policies.

        ## Upload Process
        1. Request presigned URL from this endpoint
        2. Upload file directly to S3 using returned URL (PUT request)
        3. File metadata is automatically stored in database

        ## URL Expiration
        Presigned URLs are valid for 15 minutes after generation.
      tags:
        - V1 Storage
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/storage.yaml#/components/schemas/UploadRequest'
      responses:
        '200':
          description: Upload URL generated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/storage.yaml#/components/schemas/UploadResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../schemas/errors.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/storage/download:
    post:
      operationId: downloadFile
      summary: Download file from storage
      description: |
        Generates a presigned S3 download URL with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Download permission is checked via PostgREST against the `storage.objects` table.
        Users must have SELECT permission based on their custom RLS policies.

        ## Download Process
        1. Request presigned URL from this endpoint
        2. Download file directly from S3 using returned URL (GET request)

        ## URL Expiration
        Presigned URLs are valid for 15 minutes after generation.
      tags:
        - V1 Storage
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/storage.yaml#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Download URL generated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/storage.yaml#/components/schemas/DownloadResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../schemas/errors.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/storage/object:
    delete:
      operationId: deleteObject
      summary: Delete file from storage
      description: |
        Deletes a file from S3 storage with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Delete permission is checked via PostgREST against the `storage.objects` table.
        Users must have DELETE permission based on their custom RLS policies.

        ## Deletion Process
        1. Metadata is deleted from database (with RLS check)
        2. File is deleted from S3 storage
        3. If S3 deletion fails, metadata is already removed (eventual consistency)
      tags:
        - V1 Storage
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/storage.yaml#/components/schemas/DeleteObjectRequest'
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/storage.yaml#/components/schemas/MessageResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: '../schemas/errors.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'