paths:
  /api/v1/database/migrations:
    post:
      operationId: uploadDatabaseMigrations
      summary: Upload database migrations
      description: |
        Uploads SQL migration files and applies them to the user's PostgreSQL database.

        ## Authentication
        Requires JWT token (typically used by CLI tools, not browser sessions).

        ## Migration Format
        Upload a zip file containing SQL files named like: `001-seed.sql`, `002-rls.sql`, etc.
        Files are automatically renamed to golang-migrate format: `001_seed.up.sql`, `002_rls.up.sql`.

        ## Use Cases
        - CLI migration uploads via `omnibase db migration push`
        - CI/CD pipeline integrations
        - Programmatic schema management
      tags:
        - V1 Configuration
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - migrations
              properties:
                migrations:
                  type: string
                  format: binary
                  description: Zip file containing SQL migration files
      responses:
        '200':
          description: Migrations applied successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/database.yaml#/components/schemas/MigrationSuccessResponse'
        '400':
          description: No migrations zip file provided
          content:
            application/json:
              schema:
                $ref: '../schemas/database.yaml#/components/schemas/MigrationErrorResponse'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/database/typegen:
    get:
      operationId: generateDatabaseTypes
      summary: Generate types from database schema
      description: |
        Generates type definitions from the database schema using postgres-meta.

        ## Supported Languages
        - `typescript` (default) - TypeScript type definitions
        - `go` - Go struct definitions
        - `swift` (beta) - Swift type definitions

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - CLI type generation via `omnibase db typegen`
        - CI/CD pipeline type generation
        - Programmatic type generation for SDKs
      tags:
        - V1 Configuration
      security:
        - ServiceKeyAuth: []
      parameters:
        - name: schemas
          in: query
          description: Comma-separated list of database schemas to include (valid PostgreSQL identifiers)
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z_][a-zA-Z0-9_]*(,[a-zA-Z_][a-zA-Z0-9_]*)*$'
            default: public
            example: public,auth
        - name: language
          in: query
          description: Target language for type generation
          required: false
          schema:
            type: string
            enum: [typescript, go, swift]
            default: typescript
            example: typescript
      responses:
        '200':
          description: Generated type definitions
          content:
            text/plain:
              schema:
                type: string
                description: Type definitions as plain text
        '400':
          description: Unsupported language
          content:
            application/json:
              schema:
                $ref: '../schemas/database.yaml#/components/schemas/MigrationErrorResponse'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '502':
          description: Failed to connect to typegen service
          content:
            application/json:
              schema:
                $ref: '../schemas/database.yaml#/components/schemas/MigrationErrorResponse'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/database/migrations/status:
    get:
      operationId: getDatabaseMigrationStatus
      summary: Get applied migration status
      description: |
        Returns the migrations recorded in the `migrations.schema_migrations`
        tracking table, ordered by version descending. A `dirty` migration
        indicates a previous run failed partway and needs manual intervention.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - Inspect applied migrations via `omnibase db migrate status`
        - Detect dirty/failed migration state in CI
      tags:
        - V1 Configuration
      security:
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Applied migrations retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '../schemas/database.yaml#/components/schemas/AppliedMigration'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/database/migrations/down:
    post:
      operationId: rollbackDatabaseMigrations
      summary: Roll back database migrations
      description: |
        Rolls back the last N migrations using the supplied migration files.

        **WARNING: Rolling back migrations can be destructive.** Down migrations
        may drop tables or columns and permanently delete data.

        ## Authentication
        Requires service key authentication (typically used by CLI tools).

        ## Migration Format
        Upload a zip file containing the SQL migration files (the same set used
        to apply the migrations). Files are renamed to golang-migrate format so
        the matching `*.down.sql` files can be executed.

        ## Use Cases
        - Roll back migrations via `omnibase db migrate down`
        - Undo a faulty migration during development
      tags:
        - V1 Configuration
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - steps
                - migrations
              properties:
                steps:
                  type: integer
                  minimum: 1
                  description: Number of migrations to roll back
                  example: 1
                migrations:
                  type: string
                  format: binary
                  description: Zip file containing SQL migration files
      responses:
        '200':
          description: Migrations rolled back successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Rolled back 1 migration(s)
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'