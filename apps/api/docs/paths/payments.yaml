paths:
  /api/v1/payments/checkout:
    post:
      operationId: createCheckout
      summary: Create checkout session
      description: |
        Creates a Stripe Checkout Session for the specified price ID. The session URL can be used to redirect users to complete payment.

        ## Authentication
        Optional cookie authentication. If authenticated and user has a Stripe customer ID, it will be used; otherwise, a new customer will be created.

        ## Use Cases
        - Subscription sign-ups
        - One-time purchases
        - Trial period checkouts
        - Promotional code redemption
      tags:
        - V1 Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/CreateCheckoutRequest'
      responses:
        '200':
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/CreateCheckoutResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/portal:
    post:
      operationId: createCustomerPortal
      summary: Create customer portal session
      description: |
        Creates a Stripe Customer Portal session where users can manage their subscription, payment methods, and billing history.

        ## Authentication
        Requires cookie authentication with an associated Stripe customer ID (set via payments middleware).

        ## Prerequisites
        - User must be authenticated
        - Tenant must have a Stripe customer ID configured
        - If stripe_customer_id not found in context, returns 400: "stripe_customer_id not found in context"

        ## Use Cases
        - Subscription management
        - Payment method updates
        - Invoice history viewing
        - Subscription cancellation
      tags:
        - V1 Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/CreatePortalRequest'
      responses:
        '200':
          description: Portal session created successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/CreatePortalResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/usage:
    post:
      operationId: recordUsage
      summary: Record metered usage
      description: |
        Records a usage event for metered billing. The customer must have an active subscription with metered pricing.

        ## Authentication
        Either:
        - Session cookie (Kratos) — customer resolved from the user's active tenant
        - `X-Service-Key` + `X-Tenant-Id` — customer resolved from the tenant record
        - `X-Service-Key` + `X-Stripe-Customer-Id` — customer specified directly

        ## Use Cases
        - API request metering
        - Compute time tracking
        - Storage usage recording
        - Any metered billing scenario
      tags:
        - V1 Payments
      parameters:
        - name: X-Tenant-Id
          in: header
          required: false
          description: Tenant ID (UUID) - Used to look up the Stripe customer ID from tenant configuration. Required if X-Stripe-Customer-Id and session cookie are absent.
          schema:
            type: string
            format: uuid
        - name: X-Stripe-Customer-Id
          in: header
          required: false
          description: Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer. Required if X-Tenant-Id and session cookie are absent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/RecordUsageRequest'
      responses:
        '200':
          description: Usage recorded successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/invoices:
    post:
      operationId: createInvoice
      summary: Create invoice
      description: |
        Creates a new draft invoice for the specified customer.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Customer Identification
        You must provide the Stripe customer ID using ONE of:
        - `X-Stripe-Customer-Id` header: Directly specify the Stripe customer ID
        - `X-Tenant-Id` header: Look up the Stripe customer ID from the tenant's configuration

        ## Use Cases
        - Creating invoices for platform fees
        - Manual billing scenarios
        - Custom invoice generation
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: X-Tenant-Id
          in: header
          required: false
          description: Tenant ID (UUID) - Used to look up the Stripe customer ID from tenant configuration. Required if X-Stripe-Customer-Id is not provided.
          schema:
            type: string
            format: uuid
        - name: X-Stripe-Customer-Id
          in: header
          required: false
          description: Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer. Required if X-Tenant-Id is not provided.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/CreateInvoiceRequest'
      responses:
        '200':
          description: Invoice created successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      summary: Get invoice
      description: |
        Retrieves a Stripe invoice by its ID.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Use Cases
        - Webhook processing
        - Invoice status checking
        - Invoice data retrieval
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^in_[A-Za-z0-9]+$'
          description: Stripe Invoice ID
      responses:
        '200':
          description: Invoice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'
    patch:
      operationId: updateInvoice
      summary: Update invoice
      description: |
        Updates a draft invoice's description and metadata.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Adding custom descriptions
        - Adding metadata for tracking
        - Customizing invoice before sending
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^in_[A-Za-z0-9]+$'
          description: Stripe Invoice ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/UpdateInvoiceRequest'
      responses:
        '200':
          description: Invoice updated successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/invoices/{invoice_id}/items:
    post:
      operationId: addInvoiceLineItem
      summary: Add invoice line item
      description: |
        Adds a new line item to a draft invoice.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Customer Identification
        You must provide the Stripe customer ID using ONE of:
        - `X-Stripe-Customer-Id` header: Directly specify the Stripe customer ID
        - `X-Tenant-Id` header: Look up the Stripe customer ID from the tenant's configuration

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Adding platform fees
        - Adding additional charges
        - Custom billing line items
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: X-Tenant-Id
          in: header
          required: false
          description: Tenant ID (UUID) - Used to look up the Stripe customer ID from tenant configuration. Required if X-Stripe-Customer-Id is not provided.
          schema:
            type: string
            format: uuid
        - name: X-Stripe-Customer-Id
          in: header
          required: false
          description: Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer. Required if X-Tenant-Id is not provided.
          schema:
            type: string
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^in_[A-Za-z0-9]+$'
          description: Stripe Invoice ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/AddInvoiceLineItemRequest'
      responses:
        '200':
          description: Line item added successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceLineItemResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/invoices/{invoice_id}/items/price:
    post:
      operationId: addInvoiceLineItemWithPriceId
      summary: Add invoice line item with price ID
      description: |
        Adds a new line item to a draft invoice using a price ID and quantity.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Customer Identification
        You must provide the Stripe customer ID using ONE of:
        - `X-Stripe-Customer-Id` header: Directly specify the Stripe customer ID
        - `X-Tenant-Id` header: Look up the Stripe customer ID from the tenant's configuration

        ## Price ID Resolution
        You must provide ONE of:
        - `price_id`: A config price ID (e.g., "hetzner_cx23_nbg1_hourly") that will be looked up via the Stripe ID mapping table
        - `stripe_price_id`: A raw Stripe price ID (e.g., "price_1ABC...") that will be used directly

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Adding metered usage line items
        - Adding subscription-based charges
        - Billing for compute hours, storage, etc.
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: X-Tenant-Id
          in: header
          required: false
          description: Tenant ID (UUID) - Used to look up the Stripe customer ID from tenant configuration. Required if X-Stripe-Customer-Id is not provided.
          schema:
            type: string
            format: uuid
        - name: X-Stripe-Customer-Id
          in: header
          required: false
          description: Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer. Required if X-Tenant-Id is not provided.
          schema:
            type: string
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^in_[A-Za-z0-9]+$'
          description: Stripe Invoice ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/AddInvoiceLineItemWithPriceIDRequest'
      responses:
        '200':
          description: Line item added successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceLineItemResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'

  /api/v1/payments/invoices/{invoice_id}/finalize:
    post:
      operationId: finalizeInvoice
      summary: Finalize invoice
      description: |
        Finalizes a draft invoice, optionally auto-advancing to send it immediately.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Approving invoices for sending
        - Completing invoice preparation
        - Triggering invoice emails
      tags:
        - V1 Payments
      parameters:
        - name: X-Service-Key
          in: header
          required: true
          description: Service key for authentication
          schema:
            type: string
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^in_[A-Za-z0-9]+$'
          description: Stripe Invoice ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/payments.yaml#/components/schemas/FinalizeInvoiceRequest'
      responses:
        '200':
          description: Invoice finalized successfully
          content:
            application/json:
              schema:
                $ref: '../schemas/payments.yaml#/components/schemas/InvoiceResponse'
        '400':
          $ref: '../schemas/errors.yaml#/components/responses/BadRequestError'
        '401':
          $ref: '../schemas/errors.yaml#/components/responses/UnauthorizedError'
        '404':
          $ref: '../schemas/errors.yaml#/components/responses/NotFoundError'
        '409':
          $ref: '../schemas/errors.yaml#/components/responses/ConflictError'
        '429':
          $ref: '../schemas/errors.yaml#/components/responses/TooManyRequestsError'
        '500':
          $ref: '../schemas/errors.yaml#/components/responses/InternalServerError'
