  # ==================== Subscription Management Endpoints ====================
  
  /api/v1/tenants/subscriptions:
    get:
      tags:
        - V1 Tenants
      summary: Get tenant subscriptions
      description: |
        Returns all active Stripe subscriptions associated with the tenant's Stripe customer.
        
        ## Authentication
        Requires JWT token with tenant context.
        
        ## Use Cases
        - Display current subscriptions
        - Billing overview
        - Subscription management UI
      operationId: listTenantSubscriptions
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Tenant subscriptions retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '../schemas/tenants.yaml#/components/schemas/SubscriptionResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch subscriptions
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

    post:
      tags:
        - V1 Tenants
      summary: Add subscription
      description: |
        Adds a Stripe subscription for the authenticated tenant using the provided plan ID.
        
        ## Authentication
        Requires JWT token with tenant context.
        
        ## Request Parameters
        - **plan_id** (required): The configuration item ID (e.g., "neon_compute_starter") that maps to a Stripe price
        - **stripe_customer_id** (optional): Override tenant's Stripe customer ID if needed
        
        ## Process Flow
        1. Validates the plan_id and maps it to a Stripe price_id via the stripe_id_mappings table
        2. Resolves the Stripe customer ID from the authenticated tenant (or uses provided stripe_customer_id)
        3. Checks if subscription already exists for this plan to prevent duplicates
        4. Creates the subscription in Stripe with the specified price
        5. Returns the subscription ID and status
        
        ## Notes
        - If a subscription for this plan already exists, returns a 400 error
        - The subscription is created immediately and begins billing
        
        ## Use Cases
        - Subscribe tenant to metered pricing plans (compute, storage, workers)
        - Enable usage-based billing for resources
        - Add additional services to tenant's billing
      operationId: addSubscription
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tenants.yaml#/components/schemas/AddSubscriptionRequest'
      responses:
        '200':
          description: Subscription added successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/tenants.yaml#/components/schemas/AddSubscriptionResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Plan not found - no Stripe price mapping found for the provided plan_id
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create subscription or fetch tenant
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

    delete:
      tags:
        - V1 Tenants
      summary: Remove subscription
      description: |
        Cancels a Stripe subscription immediately for the authenticated tenant based on the plan ID.
        
        ## Authentication
        Requires JWT token with tenant context.
        
        ## Request Parameters
        - **plan_id** (required): The configuration item ID (e.g., "neon_compute_starter") to identify which subscription to cancel
        - **stripe_customer_id** (optional): Override tenant's Stripe customer ID if needed
        
        ## Process Flow
        1. Validates the plan_id and maps it to a Stripe price_id via the stripe_id_mappings table
        2. Resolves the Stripe customer ID from the authenticated tenant (or uses provided stripe_customer_id)
        3. Finds the active subscription matching the price_id for the customer
        4. Cancels the subscription immediately in Stripe
        5. Returns the cancellation confirmation
        
        ## Notes
        - The subscription is canceled immediately, not at the end of the billing period
        - If no matching subscription is found, returns a 404 error
        - Only active, trialing, or past_due subscriptions can be canceled
        
        ## Use Cases
        - Remove specific service subscriptions from tenant
        - Downgrade by removing premium features
        - Stop billing for unused resources
      operationId: removeSubscription
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tenants.yaml#/components/schemas/RemoveSubscriptionRequest'
      responses:
        '200':
          description: Subscription canceled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/tenants.yaml#/components/schemas/RemoveSubscriptionResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: No matching subscription found for the plan
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to cancel subscription or map plan_id
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

  /api/v1/tenants/subscriptions/{config_price_id}:
    get:
      tags:
        - V1 Tenants
      summary: Get tenant subscription by plan
      description: |
        Returns a single subscription for the specified config_price_id (plan ID).

        ## Authentication
        Requires JWT token with tenant context.

        ## Use Cases
        - Check if tenant has a specific subscription
        - Get subscription details for a specific plan
        - Retrieve Stripe subscription ID for a plan
      operationId: getTenantSubscription
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      parameters:
        - name: config_price_id
          in: path
          required: true
          description: The configuration price ID (plan ID) to look up
          schema:
            type: string
          example: "neon_compute_starter"
      responses:
        '200':
          description: Subscription found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/tenants.yaml#/components/schemas/SubscriptionResponse'
        '400':
          description: Missing config_price_id parameter
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found for the specified plan
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to fetch subscription
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

  # ==================== Invitation Endpoints ====================
  
  /api/v1/tenants/invites:
    post:
      tags:
        - V1 Tenants
      summary: Create tenant invite
      description: |
        Creates a tenant invitation with a 7-day expiry token and sends an email to the invited user.
        
        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session with `invite_user` permission
        - **Service Key Auth**: Requires X-Service-Key + X-Tenant-ID + X-User-ID headers with `invite_user` permission
        
        ## Process
        1. Verifies user has invite permission
        2. Creates invite with unique token (7-day expiry)
        3. Sends invitation email asynchronously
        
        ## Use Cases
        - Add team members to organization
        - Invite collaborators with specific roles
      operationId: createInvite
      parameters:
        - name: X-User-Id
          in: header
          required: false
          description: User ID (UUID) - Required when using X-Service-Key header
          schema:
            type: string
            format: uuid
        - name: X-Tenant-Id
          in: header
          required: false
          description: Tenant ID (UUID) - Required when using X-Service-Key header
          schema:
            type: string
            format: uuid
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tenants.yaml#/components/schemas/CreateTenantUserInviteRequest'
      responses:
        '200':
          description: Invite sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/tenants.yaml#/components/schemas/CreateTenantUserInviteResponse'
        '400':
          description: Bad request - Invalid or missing required headers/body
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
                example: "400 Bad Request"
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions to invite users
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create invite
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

  /api/v1/tenants/invites/accept:
    put:
      tags:
        - V1 Tenants
      summary: Accept tenant invite
      description: |
        Accepts a tenant invitation using the token from the invite email and adds the user to the organization.
        
        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session - User's email must match the invite email
        - **Service Key Auth**: Requires X-Service-Key + X-User-ID header
        
        ## Process
        1. Validates invite token and expiry
        2. Verifies user's email matches invite email
        3. Marks invite as used
        4. Adds user to tenant
        5. Assigns role with permissions
        6. Sets as active tenant and returns JWT token
      operationId: acceptInvite
      parameters:
        - name: X-User-Id
          in: header
          required: false
          description: User ID (UUID) - Required when using X-Service-Key header
          schema:
            type: string
            format: uuid
      security:
        - CookieAuth: []
        - SessionTokenAuth: []
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tenants.yaml#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Successfully joined organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/tenants.yaml#/components/schemas/AcceptInviteResponse'
        '400':
          description: Invalid or expired invite token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Email mismatch - invite sent to different address
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Failed to accept invite
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/ErrorResponse'

