paths:
  /api/v1/stripe/schema:
    get:
      tags:
        - V1 Configuration
      summary: Get Stripe config schema
      description: |
        Returns the JSON schema definition for validating Stripe configuration files.
        
        ## Use Cases
        - Validate configuration before upload
        - IDE autocomplete support
        - Generate configuration templates
      operationId: getStripeConfigSchema
      responses:
        '200':
          description: JSON schema for Stripe configuration
          content:
            application/schema+json:
              schema:
                type: object
        '500':
          description: Failed to load schema
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/config:
    get:
      tags:
        - V1 Stripe
      summary: Get public Stripe config
      description: |
        Returns the current Stripe configuration with public prices only (filters out enterprise prices).
        
        ## Authentication
        No authentication required for public endpoint.
        
        ## Use Cases
        - Display pricing to users
        - Build subscription selection UI
        - Public pricing pages
      operationId: getStripeConfig
      responses:
        '200':
          description: Stripe configuration retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigResponse'
        '500':
          description: Failed to retrieve configuration
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/config:
    get:
      tags:
        - V1 Stripe
      summary: Get full Stripe config (admin)
      description: |
        Returns the complete Stripe configuration including all prices (both public and enterprise).
        
        ## Authentication
        Requires admin JWT token.
        
        ## Use Cases
        - Admin configuration management
        - Enterprise pricing display
        - Configuration auditing
      operationId: getStripeConfigAdmin
      security:
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Full Stripe configuration retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigResponse'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to retrieve configuration
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

    post:
      tags:
        - V1 Configuration
      summary: Update Stripe config
      description: |
        Updates the Stripe configuration and syncs with Stripe API to create/update products, prices, meters, and webhooks.

        ## Authentication
        Requires admin JWT token.

        ## Use Cases
        - Deploy new pricing
        - Update product definitions
        - Modify metered billing settings
        - Configure webhook endpoints

        ## Webhooks
        Include a `webhooks` array to configure webhook endpoints. Webhooks not in the array will be deleted.
        Each webhook can have `connect: true` to listen to events from connected accounts.
      operationId: updateStripeConfig
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigUpdateRequest'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigUpdateResponse'
        '400':
          description: Invalid configuration, validation errors, or configuration data is required
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'

  /api/v1/stripe/admin/config/history:
    get:
      tags:
        - V1 Configuration
      summary: Get config history
      description: |
        Returns paginated history of all Stripe configurations.
        
        ## Authentication
        Requires admin JWT token.
        
        ## Query Parameters
        - limit: Items per page (default: 10, max: 100, min: 1)
        - offset: Number of items to skip (default: 0, min: 0)
      operationId: getStripeConfigHistory
      security:
        - ServiceKeyAuth: []
      parameters:
        - name: limit
          in: query
          description: Items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Items to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Configuration history retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/ConfigHistoryResponse'
        '400':
          description: Invalid limit/offset parameters or unknown query parameter
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to retrieve history
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/config/validate:
    post:
      tags:
        - V1 Configuration
      summary: Validate Stripe config
      description: |
        Validates a Stripe configuration against the schema without saving or deploying it.
        
        ## Authentication
        Requires admin JWT token.
        
        ## Use Cases
        - Pre-deployment validation
        - Configuration testing
        - Schema compliance checking
      operationId: validateStripeConfig
      security:
        - ServiceKeyAuth: []
      requestBody:
        description: Stripe configuration to validate
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigValidateRequest'
      responses:
        '200':
          description: Configuration is valid
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
        '400':
          description: Configuration validation failed or version is required
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'

  /api/v1/stripe/admin/config/pull:
    get:
      tags:
        - V1 Configuration
      summary: Pull config from Stripe
      description: |
        Fetches all active products, prices, and meters from Stripe API and converts them to the local configuration format.
        
        ## Authentication
        Requires admin JWT token.
        
        ## Use Cases
        - Sync remote Stripe config to local
        - Import existing Stripe setup
        - Configuration backup
      operationId: pullStripeConfig
      security:
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Stripe configuration pulled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/StripeConfigurationWithIDs'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to pull configuration from Stripe
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/config/archive-all:
    post:
      tags:
        - V1 Configuration
      summary: Archive all Stripe config
      description: |
        Archives all active products, prices, and meters in Stripe and clears the local configuration.
        
        ## Authentication
        Requires admin JWT token.
        
        ## Warning
        This is a destructive operation that will archive ALL active Stripe resources.
        
        ## Use Cases
        - Clean slate for new configuration
        - Remove all test data
        - Reset Stripe account
      operationId: archiveAllStripeConfig
      security:
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Archive operation completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/ArchiveAllResponse'
        '401':
          description: Invalid or missing admin token
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to archive resources
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/config/prices/{price_id}:
    get:
      tags:
        - V1 Stripe
      summary: Get price by ID
      description: |
        Returns a specific price from the Stripe configuration by its config ID, along with its parent product.

        ## Authentication
        No authentication required for public endpoint.

        ## Use Cases
        - Fetch price details for checkout
        - Display specific pricing information
        - Subscription management
      operationId: getPriceByID
      parameters:
        - name: price_id
          in: path
          description: Price config ID
          required: true
          schema:
            type: string
            example: "basic_monthly"
      responses:
        '200':
          description: Price found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/PriceResponse'
        '400':
          description: Missing price_id
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '404':
          description: Price not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to retrieve price
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/config/prices/{price_id}/calculate:
    post:
      tags:
        - V1 Stripe
      summary: Calculate cost for a price
      description: |
        Calculates the cost in cents for a given quantity of a price, handling both flat and tiered pricing.

        ## Authentication
        No authentication required for public endpoint.

        ## Pricing Modes
        - **per_unit**: Simple flat pricing where cost = unit_amount × quantity
        - **tiered (graduated)**: Each tier's price applies only to units in that tier (like tax brackets)
        - **tiered (volume)**: The applicable tier's price applies to ALL units

        ## Use Cases
        - Calculate estimated costs for usage preview
        - Display cost estimates in dashboard
        - Usage billing calculations
      operationId: calculatePriceCost
      parameters:
        - name: price_id
          in: path
          description: Price config ID
          required: true
          schema:
            type: string
            example: "compute_hourly"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/stripe.yaml#/components/schemas/CalculatePriceCostRequest'
      responses:
        '200':
          description: Cost calculated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/CalculatePriceCostResponse'
        '400':
          description: Invalid request or missing quantity
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '404':
          description: Price not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to calculate cost
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/config/products/{product_id}:
    get:
      tags:
        - V1 Stripe
      summary: Get product by ID
      description: |
        Returns a specific product from the Stripe configuration by its config ID, including all its prices.

        ## Authentication
        No authentication required for public endpoint.

        ## Use Cases
        - Fetch product details
        - Display product information with all price options
        - Product catalog pages
      operationId: getProductByID
      parameters:
        - name: product_id
          in: path
          description: Product config ID
          required: true
          schema:
            type: string
            example: "basic_plan"
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/ProductResponse'
        '400':
          description: Missing product_id
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to retrieve product
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/config/meters/{meter_id}:
    get:
      tags:
        - V1 Stripe
      summary: Get meter by ID
      description: |
        Returns a specific billing meter from the Stripe configuration by its config ID.

        ## Authentication
        No authentication required for public endpoint.

        ## Use Cases
        - Fetch meter details for usage tracking
        - Display metered billing information
        - Usage reporting configuration
      operationId: getMeterByID
      parameters:
        - name: meter_id
          in: path
          description: Meter config ID
          required: true
          schema:
            type: string
            example: "api_requests"
      responses:
        '200':
          description: Meter found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/MeterResponse'
        '400':
          description: Missing meter_id
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '404':
          description: Meter not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to retrieve meter
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/convert/stripe-id/{stripe_id}:
    get:
      tags:
        - V1 Stripe
      summary: Convert Stripe ID to config ID
      description: |
        Converts a Stripe ID (product, price, or meter) to the corresponding config ID.
        
        ## Authentication
        No authentication required for public endpoint.
        
        ## Use Cases
        - Webhook processing
        - Subscription mapping
        - Price lookups
      operationId: convertStripeIDToConfigID
      parameters:
        - name: stripe_id
          in: path
          description: Stripe ID to convert
          required: true
          schema:
            type: string
            example: "price_1SRiyyCJIZaBlhY1NpAJFhNU"
      responses:
        '200':
          description: Config ID found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/StripeIDConversionResponse'
        '400':
          description: Missing Stripe ID
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '404':
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to retrieve mapping
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/webhooks:
    get:
      tags:
        - V1 Stripe
      summary: List all webhooks
      description: |
        Retrieves all configured webhook endpoints with their signing secrets.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - List all webhook configurations
        - Retrieve signing secrets for webhook signature verification
        - Debug webhook configuration
      operationId: listWebhooks
      security:
        - ServiceKeyAuth: []
      responses:
        '200':
          description: Webhooks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/ListWebhooksResponse'
        '401':
          description: Invalid or missing service key
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to retrieve webhooks
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/enterprise/apply-template:
    post:
      tags:
        - V1 Stripe
      summary: Apply enterprise template pricing
      description: |
        Applies template-based enterprise pricing to a tenant. This swaps the tenant's
        active subscription prices to the corresponding enterprise template prices.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - Apply pre-defined discount tiers to enterprise customers
        - Bulk pricing changes for enterprise accounts
        - Template-based enterprise onboarding

        ## Flow
        1. Validates tenant exists and has Stripe customer ID
        2. Fetches all prices with matching `enterprise_template`
        3. Swaps subscription item prices to enterprise equivalents
        4. Updates tenant's `enterprise_template` field for future provisioning
      operationId: applyEnterpriseTemplate
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/stripe.yaml#/components/schemas/ApplyEnterpriseTemplateRequest'
      responses:
        '200':
          description: Enterprise template pricing applied successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/EnterpriseApplyResponse'
        '400':
          description: Invalid request or tenant has no Stripe customer ID
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '401':
          description: Invalid or missing service key
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '404':
          description: Tenant or enterprise template not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to apply enterprise pricing
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/enterprise/apply-custom:
    post:
      tags:
        - V1 Stripe
      summary: Apply custom enterprise pricing
      description: |
        Applies tenant-specific enterprise pricing to a tenant. This swaps the tenant's
        active subscription prices to custom enterprise prices identified by enterprise_id.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - Apply custom negotiated pricing for specific enterprise customers
        - Tenant-specific pricing overrides
        - Custom enterprise onboarding

        ## Flow
        1. Validates tenant exists and has Stripe customer ID
        2. Fetches all prices with matching `enterprise_id`
        3. Swaps subscription item prices to enterprise equivalents
        4. Updates tenant's `enterprise_id` field for future provisioning
      operationId: applyEnterpriseCustom
      security:
        - ServiceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/stripe.yaml#/components/schemas/ApplyEnterpriseCustomRequest'
      responses:
        '200':
          description: Custom enterprise pricing applied successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/EnterpriseApplyResponse'
        '400':
          description: Invalid request or tenant has no Stripe customer ID
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/BadRequest'
        '401':
          description: Invalid or missing service key
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '404':
          description: Tenant or enterprise_id not found
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/NotFound'
        '500':
          description: Failed to apply enterprise pricing
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/enterprise/prices/by-template/{template}:
    get:
      tags:
        - V1 Stripe
      summary: Get enterprise prices by template
      description: |
        Retrieves prices filtered by enterprise template.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - List available enterprise prices for a template
        - Provisioning services for enterprise tenants
      operationId: getEnterprisePricesByTemplate
      security:
        - ServiceKeyAuth: []
      parameters:
        - name: template
          in: path
          description: Enterprise template to filter by
          required: true
          schema:
            type: string
            example: "tier1_10pct_off"
      responses:
        '200':
          description: Enterprise prices retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/EnterprisePricesResponse'
        '401':
          description: Invalid or missing service key
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to retrieve enterprise prices
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'

  /api/v1/stripe/admin/enterprise/prices/by-id/{enterprise_id}:
    get:
      tags:
        - V1 Stripe
      summary: Get enterprise prices by ID
      description: |
        Retrieves prices filtered by enterprise ID.

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - View custom pricing for a specific enterprise
        - Provisioning services for enterprise tenants
      operationId: getEnterprisePricesByID
      security:
        - ServiceKeyAuth: []
      parameters:
        - name: enterprise_id
          in: path
          description: Enterprise ID to filter by
          required: true
          schema:
            type: string
            example: "acme_corp"
      responses:
        '200':
          description: Enterprise prices retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas/stripe.yaml#/components/schemas/EnterprisePricesResponse'
        '401':
          description: Invalid or missing service key
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/Unauthorized'
        '500':
          description: Failed to retrieve enterprise prices
          content:
            application/json:
              schema:
                $ref: '../schemas/errors.yaml#/components/schemas/InternalServerError'