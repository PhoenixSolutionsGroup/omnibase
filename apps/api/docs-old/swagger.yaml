  /api/v1/tenants/subscriptions:
    delete:
      consumes:
      - application/json
      description: |-
        Cancels a Stripe subscription immediately for the authenticated tenant based on the plan ID.

        ## Authentication
        Requires JWT token with tenant context.

        ## Request Parameters
        - **plan_id** (required): The configuration item ID (e.g., "neon_compute_starter") to identify which subscription to cancel
        - **stripe_customer_id** (optional): Override tenant's Stripe customer ID if needed

        ## Process Flow
        1. Validates the plan_id and maps it to a Stripe price_id via the stripe_id_mappings table
        2. Resolves the Stripe customer ID from the authenticated tenant (or uses provided stripe_customer_id)
        3. Finds the active subscription matching the price_id for the customer
        4. Cancels the subscription immediately in Stripe
        5. Returns the cancellation confirmation

        ## Notes
        - The subscription is canceled immediately, not at the end of the billing period
        - If no matching subscription is found, returns a 404 error
        - Only active, trialing, or past_due subscriptions can be canceled

        ## Use Cases
        - Remove specific service subscriptions from tenant
        - Downgrade by removing premium features
        - Stop billing for unused resources
      operationId: removeSubscription
      parameters:
      - description: Subscription removal parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.RemoveSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Subscription canceled successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/tenants.RemoveSubscriptionResponse'
              type: object
        "400":
          description: Invalid request payload or tenant missing Stripe customer ID
          schema:
            $ref: '#/definitions/handlers.BadRequestResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "404":
          description: No matching subscription found for the plan
          schema:
            $ref: '#/definitions/handlers.NotFoundErrorResponse'
        "500":
          description: Failed to cancel subscription or map plan_id
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Remove subscription
      tags:
      - V1 Tenants
    get:
      description: |-
        Returns all active Stripe subscriptions associated with the tenant's Stripe customer.

        ## Authentication
        Requires JWT token with tenant context.

        ## Use Cases
        - Display current subscriptions
        - Billing overview
        - Subscription management UI
      operationId: listTenantSubscriptions
      produces:
      - application/json
      responses:
        "200":
          description: Tenant subscriptions retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.SubscriptionResponse'
                  type: array
              type: object
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/handlers.NotFoundErrorResponse'
        "500":
          description: Failed to fetch subscriptions
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Get tenant subscriptions
      tags:
      - V1 Tenants
    post:
      consumes:
      - application/json
      description: |-
        Adds a Stripe subscription for the authenticated tenant using the provided plan ID.

        ## Authentication
        Requires JWT token with tenant context.

        ## Request Parameters
        - **plan_id** (required): The configuration item ID (e.g., "neon_compute_starter") that maps to a Stripe price
        - **stripe_customer_id** (optional): Override tenant's Stripe customer ID if needed

        ## Process Flow
        1. Validates the plan_id and maps it to a Stripe price_id via the stripe_id_mappings table
        2. Resolves the Stripe customer ID from the authenticated tenant (or uses provided stripe_customer_id)
        3. Checks if subscription already exists for this plan to prevent duplicates
        4. Creates the subscription in Stripe with the specified price
        5. Returns the subscription ID and status

        ## Notes
        - If a subscription for this plan already exists, returns a 400 error
        - The subscription is created immediately and begins billing

        ## Use Cases
        - Subscribe tenant to metered pricing plans (compute, storage, workers)
        - Enable usage-based billing for resources
        - Add additional services to tenant's billing
      operationId: addSubscription
      parameters:
      - description: Subscription addition parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.AddSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Subscription added successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/tenants.AddSubscriptionResponse'
              type: object
        "400":
          description: Invalid request payload, tenant missing Stripe customer ID,
            or subscription already exists
          schema:
            $ref: '#/definitions/handlers.BadRequestResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "404":
          description: Plan not found - no Stripe price mapping found for the provided
            plan_id
          schema:
            $ref: '#/definitions/handlers.NotFoundErrorResponse'
        "500":
          description: Failed to create subscription or fetch tenant
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Add subscription
      tags:
      - V1 Tenants
  /api/v1/tenants/switch-active:
    put:
      consumes:
      - application/json
      description: |-
        Updates the user's active tenant in Kratos identity and returns a new JWT token with updated tenant context.

        ## Authentication
        Requires JWT token.

        ## Use Cases
        - Switch between organizations
        - Change context for multi-tenant users
      operationId: switchActiveTenant
      parameters:
      - description: Tenant switch parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.SwitchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully switched tenants
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/tenants.SwitchTenantResponse'
              type: object
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/handlers.BadRequestResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "500":
          description: Failed to switch tenant
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Switch active tenant
      tags:
      - V1 Tenants
  /api/v1/tenants/users:
    delete:
      consumes:
      - application/json
      description: |-
        Removes a user from the tenant and cleans up all associated permissions and Keto relationships.

        ## Authentication
        Requires JWT token with `remove_user` permission.

        ## Restrictions
        - Cannot remove the last owner (must have at least one owner)
        - Removing an owner requires `remove_owner_role` permission

        ## Process
        1. Verifies permissions
        2. Removes from role's user list
        3. Deletes all Keto relationships
        4. Removes from database
        5. Cleans up user's tenant state
      operationId: removeTenantUser
      parameters:
      - description: User removal parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.DeleteTenantUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User removed successfully
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Invalid request or cannot remove last owner
          schema:
            $ref: '#/definitions/handlers.BadRequestResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/handlers.ForbiddenResponse'
        "404":
          description: User not found in tenant
          schema:
            $ref: '#/definitions/handlers.NotFoundErrorResponse'
        "500":
          description: Failed to remove user
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Remove tenant user
      tags:
      - V1 Tenants
    get:
      description: |-
        Returns all users who are members of the tenant with their profile information and roles.

        ## Authentication
        Requires JWT token with `view_users` permission.

        ## Use Cases
        - Display team members list
        - User management UI
        - Member directory
      operationId: listTenantUsers
      produces:
      - application/json
      responses:
        "200":
          description: Tenant users retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/tenants.TenantUserResponse'
                  type: array
              type: object
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "403":
          description: Insufficient permissions - must have view_users permission
          schema:
            $ref: '#/definitions/handlers.ForbiddenResponse'
        "500":
          description: Failed to fetch tenant users
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Get tenant users
      tags:
      - V1 Tenants
    put:
      consumes:
      - application/json
      description: |-
        Updates a user's role in the tenant and updates all associated Keto permissions.

        ## Authentication
        Requires JWT token with `update_user_role` permission.

        ## Restrictions
        - Promoting to owner requires `update_user_role_to_owner` permission
        - Demoting from owner requires `remove_owner_role` permission
        - Cannot demote the last owner (must have at least one owner)

        ## Process
        1. Verifies permissions
        2. Removes old role permissions
        3. Updates database
        4. Assigns new role permissions
      operationId: updateTenantUserRole
      parameters:
      - description: Role update parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.UpdateTenantUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User role updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/tenants.UpdateTenantUserRoleResponse'
              type: object
        "400":
          description: Invalid request or cannot demote last owner
          schema:
            $ref: '#/definitions/handlers.BadRequestResponse'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/handlers.UnauthorizedResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/handlers.ForbiddenResponse'
        "404":
          description: User not found in tenant
          schema:
            $ref: '#/definitions/handlers.NotFoundErrorResponse'
        "500":
          description: Failed to update role
          schema:
            $ref: '#/definitions/handlers.InternalServerErrorResponse'
      security:
      - CookieAuth,SessionTokenAuth,ServiceKeyAuth: []
      summary: Update user role
      tags:
      - V1 Tenants
securityDefinitions:
  CookieAuth:
    description: 'Session cookie authentication. Cookie name: `ory_kratos_session`.
      Automatically set by browser after Kratos login.'
    in: header
    name: Cookie
    type: apiKey
  ServiceKeyAuth:
    description: Service-to-service authentication key for backend operations. When
      used with tenant endpoints, must include X-Tenant-ID header.
    in: header
    name: X-Service-Key
    type: apiKey
  SessionTokenAuth:
    description: Kratos session JWT token. Alternative to cookie authentication for
      non-browser clients. Obtain from Kratos after login.
    in: header
    name: X-Session-Token
    type: apiKey
swagger: "2.0"
