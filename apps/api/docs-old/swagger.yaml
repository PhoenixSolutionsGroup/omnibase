        - Assign permissions via role
        - User onboarding
      operationId: assignRole
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Role assignment parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tenants.AssignRoleRequest'
