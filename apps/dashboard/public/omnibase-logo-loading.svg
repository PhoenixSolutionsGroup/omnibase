<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
    <style>
        .hem { animation: ghost-flow 2s linear infinite; }
        @keyframes ghost-flow { from { transform: translateX(0); } to { transform: translateX(-120px); } }
        @media (prefers-reduced-motion: reduce) { .hem { animation: none; } }

       .ghost {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: ghost-bounce 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        @keyframes ghost-bounce {
            0% {
                transform: translateY(0) scale(1, 1);
            }

            20% {
                transform: translateY(8px) scale(1.08, 0.88);
            }

            50% {
                transform: translateY(-18px) scale(0.94, 1.12);
            }

            80% {
                transform: translateY(8px) scale(1.08, 0.88);
            }

            100% {
                transform: translateY(0) scale(1, 1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ghost {
                animation: none;
            }
        }

    </style>
