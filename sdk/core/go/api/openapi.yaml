  /api/v1/tenants:
    delete:
      description: |
        Deletes a tenant organization and performs cleanup of Stripe customer, Keto permissions, and user associations.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session with `delete_tenant` permission
        - **Service Key Auth**: Requires X-Service-Key + X-Tenant-ID + X-User-ID headers with `delete_tenant` permission

        ## Process
        1. Verifies user has delete permission
        2. Archives Stripe customer
        3. Deletes tenant (cascades to users, settings, invites)
        4. Cleans up all affected users' tenant state
      operationId: deleteTenant
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: Tenant ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteTenant_200_response"
          description: Tenant deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                example: 400 Bad Request
                type: string
          description: Bad request - Invalid or missing required headers/body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient permissions to delete tenant
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tenant not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
          description: Tenant has associated resources that must be deleted first
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to delete tenant
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Delete tenant
      tags:
      - V1 Tenants
    post:
      description: |
        Creates a new tenant organization with Stripe customer, sets up owner role, and makes it the active tenant for the creator.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session (user_id extracted from session)
        - **Service Key Auth**: Requires X-Service-Key + X-User-ID headers

        ## Service Key Usage
        When using service key authentication, provide the user_id via the X-User-ID header.
        The user_id must be a valid UUID matching an existing Kratos identity.

        ## Process
        1. Creates Stripe customer (if billing_email provided)
        2. Creates tenant in database
        3. Sets up default tenant settings
        4. Adds creator as owner
        5. Assigns owner role with all permissions
        6. Sets as active tenant and returns JWT token
      operationId: createTenant
      parameters:
      - description: User ID (UUID) - Required when using service key authentication
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createTenant_200_response"
          description: Tenant created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                example: 400 Bad Request
                type: string
          description: Bad request - Invalid or missing required headers/body
        "401":
          content:
