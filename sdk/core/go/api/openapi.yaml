components:
  schemas:
    AcceptRequest:
      additionalProperties: false
      example:
        token: token
      properties:
        token:
          type: string
      required:
      - token
    AcceptResponse:
      additionalProperties: false
      example:
        tenant_id: tenant_id
        message: message
        token: token
      properties:
        message:
          type: string
        tenant_id:
          type: string
        token:
          type: string
      required:
      - message
      - tenant_id
      - token
    ActiveTenantResponse:
      additionalProperties: false
      example:
        tenant:
          stripe_customer_id: stripe_customer_id
          updated_at: 2000-01-23T04:56:07.000+00:00
          name: name
          created_at: 2000-01-23T04:56:07.000+00:00
          id: id
          enterprise_id: enterprise_id
          type: type
          enterprise_template: enterprise_template
      properties:
        tenant:
          $ref: "#/components/schemas/GetTenantByIDRow"
    AddLineItemByPriceRequest:
      additionalProperties: false
      example:
        metadata:
          key: metadata
        quantity: 0
        price_id: price_id
        description: description
        currency: currency
        stripe_price_id: stripe_price_id
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
        description:
          minLength: 1
          type: string
        metadata:
          additionalProperties:
            type: string
        price_id:
          type: string
        quantity:
          format: int64
          type: integer
        stripe_price_id:
          type: string
      required:
      - currency
      - description
      - quantity
    AddLineItemRequest:
      additionalProperties: false
      example:
        amount: 0
        description: description
        currency: currency
      properties:
        amount:
          format: int64
          type: integer
        currency:
          maxLength: 3
          minLength: 3
          type: string
        description:
          minLength: 1
          type: string
      required:
      - amount
      - currency
      - description
    AddRequest:
      additionalProperties: false
      example:
