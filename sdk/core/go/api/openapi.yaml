  /api/v1/stripe/admin/config/history:
    get:
      operationId: getStripeConfigHistory
      parameters:
      - explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 10
          format: int64
          type: integer
        style: form
      - explode: false
        in: query
        name: offset
        required: false
