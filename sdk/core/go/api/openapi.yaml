openapi: 3.1.0
info:
  contact:
    email: support@omnibase.dev
    name: Omnibase Support
    url: https://omnibase.dev/support
  description: "Self-hostable Backend-as-a-Service providing database management,\
    \ authentication, payments, storage, and email services."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://omnibase.dev/terms
  title: Omnibase REST API
  version: 0.0.0-dev
servers:
- description: Production server
  url: https://api.omnibase.tech
paths:
  /api/v1/auth/active-tenant:
    get:
      operationId: getActiveTenant
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTenantResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Get the active tenant for the authenticated user
      tags:
      - V1Auth
  /api/v1/auth/identity:
    get:
      operationId: getIdentity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      summary: Get current identity
      tags:
      - V1Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - explode: false
        in: header
        name: Cookie
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      summary: Logout user
      tags:
      - V1Auth
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      summary: Get current session
      tags:
      - V1Auth
  /api/v1/auth/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: List tenants the authenticated user belongs to
      tags:
      - V1Auth
  /api/v1/auth/users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Create a new user identity
      tags:
      - V1Auth
  /api/v1/auth/whoami:
    get:
      operationId: whoAmI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      summary: Get authenticated user identity
      tags:
      - V1Auth
  /api/v1/database/migrations:
    post:
      operationId: uploadDatabaseMigrations
      requestBody:
        content:
          multipart/form-data:
            encoding:
              migrations:
                contentType: application/octet-stream
                style: form
            schema:
              $ref: "#/components/schemas/uploadDatabaseMigrations_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyMigrationsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Apply database migrations
      tags:
      - V1Database
  /api/v1/database/migrations/down:
    post:
      operationId: rollbackDatabaseMigrations
      requestBody:
        content:
          multipart/form-data:
            encoding:
              migrations:
                contentType: application/octet-stream
                style: form
              steps:
                contentType: text/plain
                style: form
            schema:
              $ref: "#/components/schemas/rollbackDatabaseMigrations_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationsDownResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Roll back database migrations
      tags:
      - V1Database
  /api/v1/database/migrations/status:
    get:
      operationId: getDatabaseMigrationStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AppliedMigration"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Get the status of applied migrations
      tags:
      - V1Database
  /api/v1/database/typegen:
    get:
      operationId: generateDatabaseTypes
      parameters:
      - explode: false
        in: query
        name: language
        required: false
        schema:
          default: typescript
          enum:
          - typescript
          - go
          - swift
          type: string
        style: form
      - explode: false
        in: query
        name: schemas
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Generate type definitions for the database schema
      tags:
      - V1Database
  /api/v1/email/send:
    post:
      operationId: sendEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Send an email
      tags:
      - V1Configuration
  /api/v1/email/templates:
    get:
      operationId: getEmailTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTemplatesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Get all email templates
      tags:
      - V1Configuration
    post:
      operationId: createOrUpdateEmailTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTemplateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Create or update email template
      tags:
      - V1Configuration
  /api/v1/email/templates/{template_name}/{type}:
    get:
      operationId: serveEmailTemplate
      parameters:
      - explode: false
        in: path
        name: template_name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Cache-Control:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Serve an email template file
      tags:
      - V1Configuration
  /api/v1/email/templates/{type}:
    delete:
      operationId: deleteEmailTemplate
      parameters:
      - explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTemplateResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Delete email template
      tags:
      - V1Configuration
  /api/v1/payments/checkout:
    post:
      operationId: createCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCheckoutResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Create a Stripe checkout session
      tags:
      - V1Payments
  /api/v1/payments/invoices:
    post:
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Create a Stripe invoice
      tags:
      - V1Payments
  /api/v1/payments/invoices/{invoice_id}:
    get:
      operationId: getInvoice
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Get a Stripe invoice
      tags:
      - V1Payments
    patch:
      operationId: updateInvoice
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Update a Stripe invoice
      tags:
      - V1Payments
  /api/v1/payments/invoices/{invoice_id}/finalize:
    post:
      operationId: finalizeInvoice
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Finalize a Stripe invoice
      tags:
      - V1Payments
  /api/v1/payments/invoices/{invoice_id}/items:
    post:
      operationId: addInvoiceLineItem
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLineItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceLineItemResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Add a line item to a Stripe invoice
      tags:
      - V1Payments
  /api/v1/payments/invoices/{invoice_id}/items/price:
    post:
      operationId: addInvoiceLineItemWithPriceId
      parameters:
      - explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddLineItemByPriceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceLineItemResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Add a line item to a Stripe invoice using a price ID
      tags:
      - V1Payments
  /api/v1/payments/portal:
    post:
      operationId: createCustomerPortal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePortalResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Create a Stripe customer portal session
      tags:
      - V1Payments
  /api/v1/payments/usage:
