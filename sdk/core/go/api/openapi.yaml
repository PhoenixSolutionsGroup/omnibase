            application/json:
              schema:
                $ref: "#/components/schemas/getTenantSubscription_200_response"
          description: Subscription found
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing config_price_id parameter
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Subscription not found for the specified plan
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to fetch subscription
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Get tenant subscription by plan
      tags:
      - V1 Tenants
  /api/v1/tenants/invites:
    post:
      description: |
        Creates a tenant invitation with a 7-day expiry token and sends an email to the invited user.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session with `invite_user` permission
        - **Service Key Auth**: Requires X-Service-Key + X-Tenant-ID + X-User-ID headers with `invite_user` permission

        ## Process
        1. Verifies user has invite permission
        2. Creates invite with unique token (7-day expiry)
        3. Sends invitation email asynchronously

        ## Use Cases
        - Add team members to organization
        - Invite collaborators with specific roles
      operationId: createInvite
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: Tenant ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantUserInviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvite_200_response"
          description: Invite sent successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                example: 400 Bad Request
                type: string
          description: Bad request - Invalid or missing required headers/body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Insufficient permissions to invite users
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tenant not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to create invite
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Create tenant invite
      tags:
      - V1 Tenants
  /api/v1/tenants/invites/accept:
    put:
      description: |
        Accepts a tenant invitation using the token from the invite email and adds the user to the organization.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session - User's email must match the invite email
        - **Service Key Auth**: Requires X-Service-Key + X-User-ID header

        ## Process
        1. Validates invite token and expiry
        2. Verifies user's email matches invite email
        3. Marks invite as used
        4. Adds user to tenant
        5. Assigns role with permissions
        6. Sets as active tenant and returns JWT token
      operationId: acceptInvite
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/acceptInvite_200_response"
          description: Successfully joined organization
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid or expired invite token
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Email mismatch - invite sent to different address
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to accept invite
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Accept tenant invite
      tags:
      - V1 Tenants
  /api/v1/tenants/jwt:
    get:
      description: |
        Generates a JWT token for direct PostgREST database access with the user's active tenant context.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session and active tenant
        - **Service Key Auth**: Requires X-Service-Key + X-Tenant-ID + X-User-ID headers

        ## Use Cases
        - Client-side database queries
        - Real-time subscriptions
        - Direct PostgREST API access
      operationId: getTenantJWT
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: Tenant ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTenantJWT_200_response"
          description: JWT token generated successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to create JWT token
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Get PostgREST JWT token
      tags:
      - V1 Tenants
  /api/v1/tenants/billing-status:
    get:
      description: |
        Checks whether the tenant has billing information configured in Stripe and if it's active.

        ## Authentication
        Requires JWT token with tenant context.

        ## Use Cases
        - Check if billing setup is required
        - Conditional feature access
        - Payment method verification
      operationId: getTenantBillingStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTenantBillingStatus_200_response"
          description: Billing status retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not authenticated
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tenant not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Failed to check billing status
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Get billing status
      tags:
      - V1 Tenants
components:
  responses:
    BadRequestError:
      content:
        application/json:
