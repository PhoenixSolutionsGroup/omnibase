      description: Conflict - Resource already exists or conflicts with current state
    NotFoundError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundResponse"
      description: Not Found - Resource not found
    TooManyRequestsError:
      content:
        application/json:
          schema:
