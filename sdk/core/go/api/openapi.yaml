openapi: 3.0.1
info:
  contact:
    email: support@omnibase.dev
    name: Omnibase Support
    url: https://omnibase.dev/support
  description: |-
    Self-hostable Backend-as-a-Service providing database management, authentication, payments, storage, and email services.

    ## Features
    - **Database**: PostgreSQL with RLS and migrations
    - **Authentication**: Ory Kratos integration with session management
    - **Payments**: Stripe integration with version-controlled billing configs
    - **Storage**: S3-compatible object storage with RLS
    - **Email**: Transactional email service
    - **Permissions**: Fine-grained access control via Ory Keto

    ## Authentication
    Most endpoints require authentication via session cookies or JWT tokens.
    Use the appropriate security scheme based on the endpoint requirements.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://omnibase.dev/terms
  title: Omnibase REST API
  version: 0.9.5
externalDocs:
  description: OpenAPI Specification
  url: https://swagger.io/specification/
servers:
- url: //https://api.omnibase.tech/
paths:
  /api/v1/auth/active-tenant:
    get:
      description: |-
        Returns the full tenant object for the user's currently active tenant.

        ## Tenant Context
        Users can be members of multiple tenants but only one is active at a time.
        The active tenant determines which resources and data the user can access.

        ## Use Case
        Determine which tenant context to use for API calls and data filtering.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_auth_active_tenant_get_200_response"
          description: Active tenant retrieved
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated
      security:
      - SessionAuth: []
      summary: Get active tenant
      tags:
      - V1 Auth
  /api/v1/auth/identity:
    get:
      description: |-
        Returns the current authenticated user's identity information (traits like email, name).

        ## Identity Data
        - User ID (unique identifier)
        - Traits (email, first name, last name based on identity schema)
        - Schema ID
        - Created/updated timestamps

        ## Use Case
        Lighter alternative to full session when you only need user profile data.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_auth_identity_get_200_response"
          description: Identity retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated or session expired
      security:
      - SessionAuth: []
      summary: Get current identity
      tags:
      - V1 Auth
  /api/v1/auth/logout:
    post:
      description: |-
        Creates a Kratos logout flow and returns the logout URL for browser redirect.

        ## Logout Process
        1. Request this endpoint to get logout URL
        2. Redirect browser to the returned logout_url
        3. Session will be invalidated and user logged out

        ## Cookie Cleanup
        The logout URL handles clearing session cookies automatically.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_auth_logout_post_200_response"
          description: Logout flow created successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to create logout flow
      security:
      - SessionAuth: []
      summary: Logout user
      tags:
      - V1 Auth
  /api/v1/auth/session:
    get:
      description: |-
        Returns the current authenticated user's session including identity and tenant information.

        ## Session Data
        - Session metadata (ID, expiry, authentication methods)
        - Identity information (user ID, traits like email, name)
        - Active tenant context (if user has tenant membership)

        ## Authentication
        Requires valid session via Cookie or X-Session-Token header.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_auth_session_get_200_response"
          description: Session retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated or session expired
      security:
      - SessionAuth: []
      summary: Get current session
      tags:
      - V1 Auth
  /api/v1/auth/whoami:
    get:
      description: |-
        Lightweight endpoint to check if the user is authenticated.

        ## Response
        Returns boolean authentication status and user ID if authenticated.

        ## Use Case
        Quick auth checks for route guards without fetching full session data.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_auth_whoami_get_200_response"
          description: Authentication status checked
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated
      security:
      - SessionAuth: []
      summary: Check authentication status
      tags:
      - V1 Auth
  /api/v1/database/migrations:
    post:
      description: |-
        Uploads SQL migration files and applies them to the user's PostgreSQL database.

        ## Authentication
        Requires JWT token (typically used by CLI tools, not browser sessions).

        ## Migration Format
        Upload a zip file containing SQL files named like: `001-seed.sql`, `002-rls.sql`, etc.
        Files are automatically renamed to golang-migrate format: `001_seed.up.sql`, `002_rls.up.sql`.

        ## Use Cases
        - CLI migration uploads via `omnibase db migration push`
        - CI/CD pipeline integrations
        - Programmatic schema management
      operationId: uploadDatabaseMigrations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadDatabaseMigrations_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.MigrationSuccessResponse"
          description: Migrations applied successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.MigrationErrorResponse"
          description: No migrations zip file provided
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing JWT token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Migration execution failed
      security:
      - BearerAuth: []
      summary: Upload database migrations
      tags:
      - V1 Database
  /api/v1/payments/checkout:
    post:
      description: |-
        Creates a Stripe Checkout Session for the specified price ID. The session URL can be used to redirect users to complete payment.

        ## Authentication
        Requires JWT token. If the user has an existing Stripe customer ID, it will be used; otherwise, a new customer will be created.

        ## Use Cases
        - Subscription sign-ups
        - One-time purchases
        - Trial period checkouts
        - Promotional code redemption
      operationId: createCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.CreateCheckoutRequest"
        description: Checkout session parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCheckout_200_response"
          description: Checkout session created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request payload
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing JWT token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to create checkout session
      security:
      - BearerAuth: []
      summary: Create checkout session
      tags:
      - V1 Payments
      x-codegen-request-body-name: request
  /api/v1/payments/portal:
    post:
      description: |-
        Creates a Stripe Customer Portal session where users can manage their subscription, payment methods, and billing history.

        ## Authentication
        Requires JWT token and an associated Stripe customer ID.

        ## Use Cases
        - Subscription management
        - Payment method updates
        - Invoice history viewing
      operationId: createCustomerPortal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.CreatePortalRequest"
        description: Portal session parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCustomerPortal_200_response"
          description: Portal session created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request or missing customer ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing JWT token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to create portal session
      security:
      - BearerAuth: []
      summary: Create customer portal session
      tags:
      - V1 Payments
      x-codegen-request-body-name: request
  /api/v1/payments/usage:
    post:
      description: |-
        Records a usage event for metered billing. The customer must have an active subscription with metered pricing.

        ## Authentication
        Requires JWT token and an associated Stripe customer ID.

        ## Use Cases
        - API request metering
        - Compute time tracking
        - Storage usage recording
        - Any metered billing scenario
      operationId: recordUsage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.RecordUsageRequest"
        description: Usage event parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.SuccessResponse"
          description: Usage recorded successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request or missing customer ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing JWT token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to record usage
      security:
      - BearerAuth: []
      summary: Record metered usage
      tags:
      - V1 Payments
      x-codegen-request-body-name: request
  /api/v1/permissions/check:
    post:
      description: |-
        Checks if a subject has a specific permission on an object using Ory Keto.

        ## Authentication
        Requires session authentication.

        ## Request Format
        Provide either `subject_id` or `subject_set` (not both).

        ## Use Cases
        - Verify user permissions before performing actions
        - Implement fine-grained access control
        - Check role-based permissions
      operationId: checkPermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.CheckPermissionRequest"
        description: Permission check request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checkPermission_200_response"
          description: Permission check result
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to check permission
      security:
      - SessionAuth: []
      summary: Check permission
      tags:
      - V1 Permissions
      x-codegen-request-body-name: body
  /api/v1/permissions/namespaces:
    post:
      description: |-
        Uploads and deploys permission namespace configurations as a zip file.

        ## Authentication
        Requires JWT token with appropriate permissions.

        ## File Format
        Upload a zip file containing namespace definition files and optionally a roles.config.json file.
        The namespace files are stored in S3 and parsed to extract permission definitions.

        ## Managed Mode
        If managed hosting is enabled, this endpoint will also trigger a restart of the Keto service.

        ## Use Cases
        - CLI namespace deployment via `omnibase permissions push`
        - CI/CD pipeline integrations
        - Programmatic permission management
      operationId: deployPermissionNamespaces
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/deployPermissionNamespaces_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deployPermissionNamespaces_200_response"
          description: Namespaces deployed successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid file or missing tenant ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing JWT token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to deploy namespaces
      security:
      - BearerAuth: []
      summary: Deploy Keto namespace configurations
      tags:
      - V1 Permissions
  /api/v1/permissions/relationships:
    post:
      description: |-
        Creates a new relationship tuple in Ory Keto.

        ## Authentication
        Requires session authentication.

        ## Request Format
        Provide either `subject_id` or `subject_set` (not both).

        ## Use Cases
        - Link resources to tenants
        - Assign users to projects
        - Create permission relationships
      operationId: createRelationship
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.CreateRelationshipRequest"
        description: Relationship creation request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createRelationship_200_response"
          description: Relationship created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Not authenticated
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to create relationship
      security:
      - SessionAuth: []
      summary: Create relationship
      tags:
      - V1 Permissions
      x-codegen-request-body-name: body
  /api/v1/storage/download:
    post:
      description: |-
        Generates a presigned S3 download URL with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Download permission is checked via PostgREST against the `storage.objects` table.
        Users must have SELECT permission based on their custom RLS policies.

        ## Download Process
        1. Request presigned URL from this endpoint
        2. Download file directly from S3 using returned URL (GET request)

        ## URL Expiration
        Presigned URLs are valid for 15 minutes after generation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/models.DownloadRequest"
        description: Path of file to download
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_storage_download_post_200_response"
          description: Download URL generated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request body or missing path
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Missing authentication session
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ForbiddenResponse"
          description: RLS policy denied download access for this path
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.NotFoundErrorResponse"
          description: File not found in storage
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to generate presigned URL
      security:
      - SessionAuth: []
      summary: Download file from storage
      tags:
      - V1 Storage
      x-codegen-request-body-name: request
  /api/v1/storage/object:
    delete:
      description: |-
        Deletes a file from S3 storage with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Delete permission is checked via PostgREST against the `storage.objects` table.
        Users must have DELETE permission based on their custom RLS policies.

        ## Deletion Process
        1. Metadata is deleted from database (with RLS check)
        2. File is deleted from S3 storage
        3. If S3 deletion fails, metadata is already removed (eventual consistency)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/models.DeleteObjectRequest"
        description: Path of file to delete
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_storage_object_delete_200_response"
          description: File deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request body or missing path
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Missing authentication session
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ForbiddenResponse"
          description: RLS policy denied delete access for this path
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.NotFoundErrorResponse"
          description: File not found or already deleted
      security:
      - SessionAuth: []
      summary: Delete file from storage
      tags:
      - V1 Storage
      x-codegen-request-body-name: request
  /api/v1/storage/upload:
    post:
      description: |-
        Generates a presigned S3 upload URL with Row-Level Security (RLS) enforcement.

        ## RLS Policy
        Upload permission is checked via PostgREST against the `storage.objects` table.
        Users must have INSERT permission based on their custom RLS policies.

        ## Upload Process
        1. Request presigned URL from this endpoint
        2. Upload file directly to S3 using returned URL (PUT request)
        3. File metadata is automatically stored in database

        ## URL Expiration
        Presigned URLs are valid for 15 minutes after generation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/models.UploadRequest"
        description: Upload configuration with path and optional metadata
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_storage_upload_post_200_response"
          description: Upload URL generated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request body or missing required fields
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Missing authentication session
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ForbiddenResponse"
          description: RLS policy denied upload access for this path
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to generate presigned URL or store metadata
      security:
      - SessionAuth: []
      summary: Upload file to storage
      tags:
      - V1 Storage
      x-codegen-request-body-name: request
  /api/v1/stripe/config:
    get:
      description: |-
        Returns the current Stripe configuration with public prices only (filters out enterprise prices).

        ## Authentication
        No authentication required for public endpoint.

        ## Use Cases
        - Display pricing to users
        - Build subscription selection UI
        - Public pricing pages
      operationId: getStripeConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getStripeConfig_200_response"
          description: Stripe configuration retrieved successfully
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to retrieve configuration
      summary: Get public Stripe config
      tags:
      - V1 Stripe
    post:
      description: |-
        Updates the Stripe configuration and syncs with Stripe API to create/update products, prices, and meters.

        ## Authentication
        Requires admin JWT token.

        ## Use Cases
        - Deploy new pricing
        - Update product definitions
        - Modify metered billing settings
      operationId: updateStripeConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/models.StripeConfigData"
        description: Stripe configuration data
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.SuccessResponse"
          description: Configuration updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid configuration or validation errors
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing admin token
      security:
      - BearerAuth: []
      summary: Update Stripe config
      tags:
      - V1 Stripe
      x-codegen-request-body-name: config
  /api/v1/stripe/config/admin:
    get:
      description: |-
        Returns the complete Stripe configuration including all prices (both public and enterprise).

        ## Authentication
        Requires admin JWT token.

        ## Use Cases
        - Admin configuration management
        - Enterprise pricing display
        - Configuration auditing
      operationId: getStripeConfigAdmin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getStripeConfig_200_response"
          description: Full Stripe configuration retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing admin token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to retrieve configuration
      security:
      - BearerAuth: []
      summary: Get full Stripe config (admin)
      tags:
      - V1 Stripe
  /api/v1/stripe/config/archive-all:
    post:
      description: |-
        Archives all active products, prices, and meters in Stripe and clears the local configuration.

        ## Authentication
        Requires admin JWT token.

        ## Warning
        This is a destructive operation that will archive ALL active Stripe resources.

        ## Use Cases
        - Clean slate for new configuration
        - Remove all test data
        - Reset Stripe account
      operationId: archiveAllStripeConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/archiveAllStripeConfig_200_response"
          description: Archive operation completed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing admin token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to archive resources
      security:
      - BearerAuth: []
      summary: Archive all Stripe config
      tags:
      - V1 Stripe
  /api/v1/stripe/config/history:
    get:
      description: |-
        Returns paginated history of all Stripe configurations.

        ## Authentication
        Requires admin JWT token.

        ## Query Parameters
        - limit: Items per page (default: 10, max: 100)
        - offset: Number of items to skip (default: 0)
      operationId: getStripeConfigHistory
      parameters:
      - description: Items per page
        in: query
        name: limit
        schema:
          default: 10
          type: integer
      - description: Items to skip
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getStripeConfigHistory_200_response"
          description: Configuration history retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: Invalid or missing admin token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to retrieve history
      security:
      - BearerAuth: []
