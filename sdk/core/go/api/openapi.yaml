        - Cannot demote the last owner (must have at least one owner)

        ## Process
        1. Verifies permissions
        2. Removes old role permissions
        3. Updates database
        4. Assigns new role permissions
      operationId: updateTenantUserRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tenants.UpdateTenantUserRoleRequest"
        description: Role update parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateTenantUserRole_200_response"
          description: User role updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.BadRequestResponse"
          description: Invalid request or cannot demote last owner
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.UnauthorizedResponse"
          description: User not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.ForbiddenResponse"
          description: Insufficient permissions
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.NotFoundErrorResponse"
          description: User not found in tenant
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.InternalServerErrorResponse"
          description: Failed to update role
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - V1 Tenants
      x-codegen-request-body-name: request
