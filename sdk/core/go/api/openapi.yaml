      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteObjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteObjectResponse"
          description: OK
        default:
