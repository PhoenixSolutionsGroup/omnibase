openapi: 3.1.0
info:
  contact:
    email: support@omnibase.dev
    name: Omnibase Support
    url: https://omnibase.dev/support
  description: |
    Self-hostable Backend-as-a-Service providing database management, authentication, payments, storage, and email services.

    ## Features
    - **Database**: PostgreSQL with RLS and migrations
    - **Authentication**: Ory Kratos integration with session management
    - **Payments**: Stripe integration with version-controlled billing configs
    - **Storage**: S3-compatible object storage with RLS
    - **Email**: Transactional email service
    - **Permissions**: Fine-grained access control

    ## Authentication
    Most endpoints require authentication via session cookies or JWT tokens.
    Use the appropriate security scheme based on the endpoint requirements.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://omnibase.dev/terms
  title: Omnibase REST API
  version: 0.19.0
externalDocs:
  description: OpenAPI Specification
  url: https://swagger.io/specification/
servers:
- description: Production server
  url: https://api.omnibase.tech
tags:
- description: Authentication and session management endpoints
  name: V1 Auth
- description: Configuration management endpoints
  name: V1 Configuration
- description: Database migration and management endpoints
  name: V1 Database
- description: Email sending endpoints
  name: V1 Email
- description: Keto namespace management endpoints
  name: V1 Keto
- description: Stripe payment and checkout endpoints
  name: V1 Payments
- description: Permission checking and relationship management endpoints
  name: V1 Permissions
- description: File storage and management endpoints
  name: V1 Storage
- description: Stripe configuration and management endpoints
  name: V1 Stripe
- description: Tenant organization management endpoints
  name: V1 Tenants
- description: Webhook configuration and management endpoints
  name: V1 Webhooks
paths:
  /api/v1/auth/session:
    get:
      description: |
        Returns the current authenticated user's session including identity and tenant information.

        ## Session Data
        - Session metadata (ID, expiry, authentication methods)
        - Identity information (user ID, traits like email, name)
        - Active tenant context (if user has tenant membership)

        ## Authentication
        Requires valid session via Cookie or X-Session-Token header.
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSession_200_response"
          description: Session retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      summary: Get current session
      tags:
      - V1 Auth
  /api/v1/auth/identity:
    get:
      description: |
        Returns the current authenticated user's identity information (traits like email, name).

        ## Identity Data
        - User ID (unique identifier)
        - Traits (email, first name, last name based on identity schema)
        - Schema ID
        - Created/updated timestamps

        ## Use Case
        Lighter alternative to full session when you only need user profile data.
      operationId: getIdentity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getIdentity_200_response"
          description: Identity retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      summary: Get current identity
      tags:
      - V1 Auth
  /api/v1/auth/logout:
    post:
      description: |
        Creates a Kratos logout flow and returns the logout URL for browser redirect.

        ## Logout Process
        1. Request this endpoint to get logout URL
        2. Redirect browser to the returned logout_url
        3. Session will be invalidated and user logged out

        ## Cookie Cleanup
        The logout URL handles clearing session cookies automatically.
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/logout_200_response"
          description: Logout flow created successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      summary: Logout user
      tags:
      - V1 Auth
  /api/v1/auth/whoami:
    get:
      description: |
        Lightweight endpoint to check if the user is authenticated.

        ## Response
        Returns boolean authentication status and user ID if authenticated.

        ## Use Case
        Quick auth checks for route guards without fetching full session data.
      operationId: whoAmI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/whoAmI_200_response"
          description: Authentication status checked
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      summary: Check authentication status
      tags:
      - V1 Auth
  /api/v1/auth/active-tenant:
    get:
      description: |
        Returns the full tenant object for the user's currently active tenant.

        ## Tenant Context
        Users can be members of multiple tenants but only one is active at a time.
        The active tenant determines which resources and data the user can access.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session
        - **Service Key Auth**: Requires X-Service-Key + X-User-ID header

        ## Use Case
        Determine which tenant context to use for API calls and data filtering.
      operationId: getActiveTenant
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getActiveTenant_200_response"
          description: Active tenant retrieved
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Get active tenant
      tags:
      - V1 Auth
  /api/v1/auth/tenants:
    get:
      description: |
        Returns all tenants the user is a member of with their active status.

        ## Authentication
        - **Session Auth**: Requires JWT token / Cookie Session
        - **Service Key Auth**: Requires X-Service-Key + X-User-ID header

        ## Tenant Memberships
        Users can be members of multiple tenants. Each membership has:
        - Active status (only one tenant can be active at a time)
        - Full tenant information (ID, name, type, etc.)

        ## Use Case
        Display tenant switcher UI or list all organizations the user belongs to.
      operationId: listTenants
      parameters:
      - description: User ID (UUID) - Required when using X-Service-Key header
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listTenants_200_response"
          description: Tenants retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - CookieAuth: []
        SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: List user's tenants
      tags:
      - V1 Auth
  /api/v1/auth/users:
    post:
      description: |
        Creates a new user identity via Kratos admin API with email/password credentials.

        ## User Creation
        - Creates Kratos identity with provided traits (email, name)
        - Sets up password authentication credentials
        - Returns the created identity information

        ## Use Case
        Administrative user creation endpoint for onboarding flows or user management.

        ## Authentication
        This is an admin endpoint that requires service key authentication.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createUser_200_response"
          description: User created successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - ServiceKeyAuth: []
      summary: Create new user
      tags:
      - V1 Auth
  /api/v1/database/migrations:
    post:
      description: |
        Uploads SQL migration files and applies them to the user's PostgreSQL database.

        ## Authentication
        Requires JWT token (typically used by CLI tools, not browser sessions).

        ## Migration Format
        Upload a zip file containing SQL files named like: `001-seed.sql`, `002-rls.sql`, etc.
        Files are automatically renamed to golang-migrate format: `001_seed.up.sql`, `002_rls.up.sql`.

        ## Use Cases
        - CLI migration uploads via `omnibase db migration push`
        - CI/CD pipeline integrations
        - Programmatic schema management
      operationId: uploadDatabaseMigrations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadDatabaseMigrations_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationSuccessResponse"
          description: Migrations applied successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationErrorResponse"
          description: No migrations zip file provided
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - ServiceKeyAuth: []
      summary: Upload database migrations
      tags:
      - V1 Configuration
  /api/v1/database/typegen:
    get:
      description: |
        Generates type definitions from the database schema using postgres-meta.

        ## Supported Languages
        - `typescript` (default) - TypeScript type definitions
        - `go` - Go struct definitions
        - `swift` (beta) - Swift type definitions

        ## Authentication
        Requires service key authentication.

        ## Use Cases
        - CLI type generation via `omnibase db typegen`
        - CI/CD pipeline type generation
        - Programmatic type generation for SDKs
      operationId: generateDatabaseTypes
      parameters:
      - description: Comma-separated list of database schemas to include (valid PostgreSQL
          identifiers)
        explode: true
        in: query
        name: schemas
        required: false
        schema:
          default: public
          example: "public,auth"
          pattern: "^[a-zA-Z_][a-zA-Z0-9_]*(,[a-zA-Z_][a-zA-Z0-9_]*)*$"
          type: string
        style: form
      - description: Target language for type generation
        explode: true
        in: query
        name: language
        required: false
        schema:
          default: typescript
          enum:
          - typescript
          - go
          - swift
          example: typescript
          type: string
        style: form
      responses:
        "200":
          content:
            text/plain:
              schema:
                description: Type definitions as plain text
                type: string
          description: Generated type definitions
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationErrorResponse"
          description: Unsupported language
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationErrorResponse"
          description: Failed to connect to typegen service
      security:
      - ServiceKeyAuth: []
      summary: Generate types from database schema
      tags:
      - V1 Configuration
  /api/v1/email/templates:
    get:
      description: |
        Retrieves all email templates stored in the database.

        ## Response
        Returns array of all templates with their type, subject, and HTML body.

        ## Use Cases
        - List available email templates
        - Display template management interface
        - Audit email template inventory
      operationId: getEmailTemplates
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getEmailTemplates_200_response"
          description: Templates retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Get all email templates
      tags:
      - V1 Configuration
    post:
      description: |
        Creates a new email template or updates an existing one based on template type.

        ## Template Management
        - If template type exists: updates subject and HTML body
        - If template type is new: creates new template entry

        ## Template Types
        Template types are user-defined identifiers (e.g., "welcome", "password-reset", "invoice").

        ## Use Cases
        - Store custom email templates for transactional emails
        - Update email content without code deployments
        - Maintain versioned email templates
      operationId: createOrUpdateEmailTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailTemplateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createOrUpdateEmailTemplate_200_response"
          description: Template created/updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                example: 400 Bad Request
                type: string
          description: Bad request - Invalid or missing required headers/body
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Create or update email template
      tags:
      - V1 Configuration
  /api/v1/email/templates/{type}:
    delete:
      description: |
        Deletes an email template by its type identifier.

        ## Deletion Process
        - Searches for template by type
        - Removes template from database if found
        - Returns 404 if template doesn't exist

        ## Use Cases
        - Remove deprecated email templates
        - Clean up test templates
        - Template lifecycle management
      operationId: deleteEmailTemplate
      parameters:
      - description: Template type identifier
        example: welcome
        explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteEmailTemplate_200_response"
          description: Template deleted successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
      - CookieAuth: []
      - SessionTokenAuth: []
      - ServiceKeyAuth: []
      summary: Delete email template
      tags:
      - V1 Configuration
  /api/v1/payments/checkout:
    post:
      description: |
        Creates a Stripe Checkout Session for the specified price ID. The session URL can be used to redirect users to complete payment.

        ## Authentication
        Optional cookie authentication. If authenticated and user has a Stripe customer ID, it will be used; otherwise, a new customer will be created.

        ## Use Cases
        - Subscription sign-ups
        - One-time purchases
        - Trial period checkouts
        - Promotional code redemption
      operationId: createCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCheckout_200_response"
          description: Checkout session created successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Create checkout session
      tags:
      - V1 Payments
  /api/v1/payments/portal:
    post:
      description: |
        Creates a Stripe Customer Portal session where users can manage their subscription, payment methods, and billing history.

        ## Authentication
        Requires cookie authentication with an associated Stripe customer ID (set via payments middleware).

        ## Prerequisites
        - User must be authenticated
        - Tenant must have a Stripe customer ID configured
        - If stripe_customer_id not found in context, returns 400: "stripe_customer_id not found in context"

        ## Use Cases
        - Subscription management
        - Payment method updates
        - Invoice history viewing
        - Subscription cancellation
      operationId: createCustomerPortal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCustomerPortal_200_response"
          description: Portal session created successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Create customer portal session
      tags:
      - V1 Payments
  /api/v1/payments/usage:
    post:
      description: |
        Records a usage event for metered billing. The customer must have an active subscription with metered pricing.

        ## Authentication
        Requires cookie authentication with an associated Stripe customer ID (set via payments middleware).

        ## Prerequisites
        - User must be authenticated
        - Tenant must have a Stripe customer ID configured
        - If stripe_customer_id not found in context, returns 400: "stripe_customer_id not found in context"

        ## Use Cases
        - API request metering
        - Compute time tracking
        - Storage usage recording
        - Any metered billing scenario
      operationId: recordUsage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUsageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
          description: Usage recorded successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Record metered usage
      tags:
      - V1 Payments
  /api/v1/payments/invoices:
    post:
      description: |
        Creates a new draft invoice for the specified customer.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Customer Identification
        You must provide the Stripe customer ID using ONE of:
        - `X-Stripe-Customer-Id` header: Directly specify the Stripe customer ID
        - `X-Tenant-Id` header: Look up the Stripe customer ID from the tenant's configuration

        ## Use Cases
        - Creating invoices for platform fees
        - Manual billing scenarios
        - Custom invoice generation
      operationId: createInvoice
      parameters:
      - description: Service key for authentication
        explode: false
        in: header
        name: X-Service-Key
        required: true
        schema:
          type: string
        style: simple
      - description: Tenant ID (UUID) - Used to look up the Stripe customer ID from
          tenant configuration. Required if X-Stripe-Customer-Id is not provided.
        explode: false
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer.\
          \ Required if X-Tenant-Id is not provided."
        explode: false
        in: header
        name: X-Stripe-Customer-Id
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvoice_200_response"
          description: Invoice created successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Create invoice
      tags:
      - V1 Payments
  /api/v1/payments/invoices/{invoice_id}:
    get:
      description: |
        Retrieves a Stripe invoice by its ID.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Use Cases
        - Webhook processing
        - Invoice status checking
        - Invoice data retrieval
      operationId: getInvoice
      parameters:
      - description: Service key for authentication
        explode: false
        in: header
        name: X-Service-Key
        required: true
        schema:
          type: string
        style: simple
      - description: Stripe Invoice ID
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          pattern: "^in_[A-Za-z0-9]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvoice_200_response"
          description: Invoice retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get invoice
      tags:
      - V1 Payments
    patch:
      description: |
        Updates a draft invoice's description and metadata.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Adding custom descriptions
        - Adding metadata for tracking
        - Customizing invoice before sending
      operationId: updateInvoice
      parameters:
      - description: Service key for authentication
        explode: false
        in: header
        name: X-Service-Key
        required: true
        schema:
          type: string
        style: simple
      - description: Stripe Invoice ID
        explode: false
        in: path
        name: invoice_id
        required: true
        schema:
          pattern: "^in_[A-Za-z0-9]+$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInvoice_200_response"
          description: Invoice updated successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Update invoice
      tags:
      - V1 Payments
  /api/v1/payments/invoices/{invoice_id}/items:
    post:
      description: |
        Adds a new line item to a draft invoice.

        ## Authentication
        Requires service key authentication via `X-Service-Key` header.

        ## Customer Identification
        You must provide the Stripe customer ID using ONE of:
        - `X-Stripe-Customer-Id` header: Directly specify the Stripe customer ID
        - `X-Tenant-Id` header: Look up the Stripe customer ID from the tenant's configuration

        ## Prerequisites
        - Invoice must be in draft status

        ## Use Cases
        - Adding platform fees
        - Adding additional charges
        - Custom billing line items
      operationId: addInvoiceLineItem
      parameters:
      - description: Service key for authentication
        explode: false
        in: header
        name: X-Service-Key
        required: true
        schema:
          type: string
        style: simple
      - description: Tenant ID (UUID) - Used to look up the Stripe customer ID from
          tenant configuration. Required if X-Stripe-Customer-Id is not provided.
        explode: false
        in: header
        name: X-Tenant-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Stripe Customer ID (e.g., cus_xxx) - Directly specify the customer.\
          \ Required if X-Tenant-Id is not provided."
        explode: false
        in: header
