      tags:
      - V1Storage
  /api/v1/stripe/admin/config:
    get:
      operationId: getStripeConfigAdmin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeConfigResponse"
