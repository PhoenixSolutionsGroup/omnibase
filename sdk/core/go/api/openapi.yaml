      operationId: updateStripeConfig
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Update Stripe config
      tags:
      - V1Configuration
  /api/v1/stripe/admin/config/archive-all:
    post:
      operationId: archiveAllStripeConfig
      responses:
        "200":
          content:
            application/json:
