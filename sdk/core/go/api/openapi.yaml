      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployNamespacesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - ServiceKeyAuth: []
      summary: Deploy Keto namespace configurations
      tags:
      - V1Configuration
  /api/v1/permissions/relationships:
    delete:
      operationId: deleteRelationship
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRelationshipRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRelationshipResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - SessionTokenAuth: []
      - CookieAuth: []
      - ServiceKeyAuth: []
      summary: Delete relationship
      tags:
