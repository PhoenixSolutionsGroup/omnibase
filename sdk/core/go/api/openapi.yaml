            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
          description: Invalid request or tenant has no Stripe customer ID
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Invalid or missing service key
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
          description: Tenant or enterprise template not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
          description: Failed to apply enterprise pricing
      security:
