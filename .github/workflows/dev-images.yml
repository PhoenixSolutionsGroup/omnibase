name: Dev Images

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - docker/**
      - sdk/core/go/**
      - .github/workflows/dev-images.yml
  workflow_dispatch:

concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: phoenixsolutionsgroup/omnibase-api
            context: .
            file: apps/api/Dockerfile
          - name: auth
            image: phoenixsolutionsgroup/omnibase-auth
            context: docker/auth
            file: docker/auth/Dockerfile
          - name: permissions
            image: phoenixsolutionsgroup/omnibase-permissions
            context: docker/permissions
            file: docker/permissions/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:dev
            ${{ matrix.image }}:dev-${{ steps.sha.outputs.short }}
          build-args: ${{ matrix.name == 'api' && format('VERSION=dev-{0}', steps.sha.outputs.short) || '' }}
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}
