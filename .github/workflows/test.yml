name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skip:
    name: Check Skip
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - name: Check commit message for skip pattern
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[skip tests]"* ]] || [[ "$COMMIT_MSG" == *"[skip ci tests]"* ]]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "⚠️ Skipping tests due to commit message pattern"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test API
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.skip_tests != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true

      - name: Install bun dependencies
        run: bun install --ignore-scripts

      - name: Run API tests (unit + integration + e2e)
        run: make -C apps/api test

      - name: Verify SDK has no drift
        run: |
          bun run generate:sdk
          if ! git diff --quiet sdk/; then
            echo "::error::SDK is out of sync with OpenAPI spec. Run 'bun run generate:sdk' and commit."
            git diff --stat sdk/
            exit 1
          fi
