name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Run tests first (required for all releases)
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache k6
        id: cache-k6
        uses: actions/cache@v4
        with:
          path: /usr/bin/k6
          key: k6-${{ runner.os }}-latest

      - name: Install k6
        if: steps.cache-k6.outputs.cache-hit != 'true'
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install schemathesis
        run: pip install schemathesis

      - name: Install dependencies
        run: bun install

      - name: Install CLI globally
        run: bun link
        working-directory: packages/cli

      - name: Create test environment config
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          mkdir -p tests/api/omnibase/environments
          cat > tests/api/omnibase/environments/.env.local <<EOF
          OMNIBASE_API_URL=http://localhost:8080
          OMNIBASE_SERVICE_KEY=VERY_SECRET_KEY
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          EOF
          sed -i 's/^[[:space:]]*//' tests/api/omnibase/environments/.env.local

      - name: Start OmniBase
        working-directory: tests/api
        run: |
          omnibase start --mode dev &
          echo "Waiting for API to be ready..."
          for i in {1..60}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/60..."
            sleep 5
          done

      - name: Sync test environment
        working-directory: tests/api
        run: omnibase sync --env local all

      - name: Run API tests
        env:
          API_URL: http://localhost:8080
          SERVICE_KEY: VERY_SECRET_KEY
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: ./scripts/test-api.sh --local

      - name: Stop OmniBase
        if: always()
        working-directory: tests/api
        run: omnibase stop || true

  # ============================================
  # Release API (Docker + Core SDKs)
  # Only runs on push to main, not on PRs
  # ============================================
  release-api:
    name: Release API
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install

      - name: Install semantic-release plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Check for API changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --match "api-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous API release found, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- apps/api/ docker/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "API has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No API changes since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Make scripts executable
        if: steps.changes.outputs.has_changes == 'true'
        run: chmod +x scripts/*.sh

      - name: Release API
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: apps/api
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

  # ============================================
  # Release npm packages (independent versions)
  # Only runs on push to main, not on PRs
  # ============================================
  release-npm:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sdk/framework/react
            name: react
          - package: sdk/framework/nextjs
            name: nextjs
          - package: sdk/component/shadcn
            name: shadcn
          - package: packages/cli
            name: cli

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install

      - name: Install semantic-release plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.package }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build package
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        run: bun run build || echo "No build script, skipping"

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx semantic-release

  # ============================================
  # Release Docker images (independent versions)
  # Only runs on push to main, not on PRs
  # ============================================
  release-docker:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: docker/auth
            name: auth
            image: phoenixsolutionsgroup/omnibase-auth
          - path: docker/permissions
            name: permissions
            image: phoenixsolutionsgroup/omnibase-permissions

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install semantic-release plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.path }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_IMAGE: ${{ matrix.image }}
        run: npx semantic-release
