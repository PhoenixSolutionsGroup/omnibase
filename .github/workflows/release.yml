name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Gate: Only proceed if tests passed
  # ============================================
  check-tests:
    name: Check Tests Passed
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Tests passed
        run: echo "Tests passed, proceeding with release"

  # ============================================
  # Release API (Docker + Core SDKs)
  # ============================================
  release-api:
    name: Release API
    runs-on: ubuntu-latest
    needs: [check-tests]
    if: needs.check-tests.result == 'success'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for API changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --match "api-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous API release found, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- apps/api/ docker/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "API has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No API changes since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.has_changes == 'true'
        with:
          go-version: "1.21"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate and build core-js SDK
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          bun run generate:sdk --js-only
          cd sdk/core/js && bun run build

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Make scripts executable
        if: steps.changes.outputs.has_changes == 'true'
        run: chmod +x scripts/*.sh

      - name: Regenerate SDKs
        if: steps.changes.outputs.has_changes == 'true'
        run: bun run generate:sdk

      - name: Release API
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: apps/api
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

  # ============================================
  # Release Docker images (independent versions)
  # ============================================
  release-docker:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-tests, release-api]
    if: |
      !cancelled() &&
      needs.check-tests.result == 'success' &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - path: docker/auth
            name: auth
            image: phoenixsolutionsgroup/omnibase-auth
          - path: docker/permissions
            name: permissions
            image: phoenixsolutionsgroup/omnibase-permissions

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.path }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Pull latest changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git pull --rebase --autostash origin main

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_IMAGE: ${{ matrix.image }}
        run: bunx semantic-release

  # ============================================
  # Release npm packages (independent versions)
  # ============================================
  release-npm:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-tests, release-api, release-docker]
    if: |
      !cancelled() &&
      needs.check-tests.result == 'success' &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped') &&
      (needs.release-docker.result == 'success' || needs.release-docker.result == 'skipped')
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - package: sdk/framework/react
            name: react
          - package: sdk/framework/nextjs
            name: nextjs
          - package: sdk/component/shadcn
            name: shadcn
          - package: packages/cli
            name: cli

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.package }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Pull latest changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git pull --rebase --autostash origin main

      - name: Build package
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        run: bun run build || echo "No build script, skipping"

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
