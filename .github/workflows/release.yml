name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Check if tests should be skipped
  # ============================================
  check-skip:
    name: Check Skip
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - name: Check commit message for skip pattern
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip tests]"* ]] || [[ "$COMMIT_MSG" == *"[skip ci tests]"* ]]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "⚠️ Skipping tests due to commit message pattern"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Run tests first (required for all releases)
  # Skip with [skip tests] or [skip ci tests] in commit message
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [check-skip]
    if: needs.check-skip.outputs.skip_tests != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache k6 binary
        id: cache-k6
        uses: actions/cache@v4
        with:
          path: ~/k6
          key: k6-${{ runner.os }}-v0.54.0

      - name: Install k6
        if: steps.cache-k6.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/k6
          curl -L https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz --strip-components=1 -C ~/k6

      - name: Add k6 to PATH
        run: echo "$HOME/k6" >> $GITHUB_PATH

      - name: Install schemathesis
        run: pip install schemathesis

      - name: Generate and build core-js SDK
        run: |
          bun run generate:sdk --js-only
          cd sdk/core/js && bun run build

      - name: Install dependencies (skip lifecycle scripts)
        run: bun install --ignore-scripts

      - name: Build and install CLI globally
        run: bun run build && bun link
        working-directory: packages/cli

      - name: Create test environment config
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          mkdir -p tests/api/omnibase/environments
          cat > tests/api/omnibase/environments/.env.local <<EOF
          OMNIBASE_API_URL=http://localhost:8080
          OMNIBASE_SERVICE_KEY=VERY_SECRET_KEY
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          EOF
          sed -i 's/^[[:space:]]*//' tests/api/omnibase/environments/.env.local

      - name: Start OmniBase
        working-directory: tests/api
        run: |
          omnibase start --mode test &
          echo "Waiting for services to be ready..."

          # Wait for API to be live first
          echo "Waiting for API..."
          for i in {1..60}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "API is live!"
              break
            fi
            echo "API attempt $i/60..."
            sleep 5
          done

          # Wait for all services to be ready (database, auth, permissions)
          echo "Waiting for all services to be ready..."
          for i in {1..60}; do
            HEALTH_RESPONSE=$(curl -s http://localhost:8080/health/ready 2>/dev/null || echo '{"ready":false}')
            if echo "$HEALTH_RESPONSE" | grep -q '"ready":true'; then
              echo "All services are ready!"
              echo "$HEALTH_RESPONSE" | jq . 2>/dev/null || echo "$HEALTH_RESPONSE"
              break
            fi
            echo "Services not ready yet (attempt $i/60)..."
            echo "$HEALTH_RESPONSE" | jq . 2>/dev/null || echo "$HEALTH_RESPONSE"
            sleep 5
          done

      - name: Sync test environment
        working-directory: tests/api
        run: omnibase sync --env local all

      - name: Restart auth and permissions
        working-directory: tests/api
        run: omnibase restart --mode test --env local auth permissions

      - name: Wait for services after sync
        run: |
          echo "Waiting for services after sync..."

          # Wait for all services to be ready via unified health check
          for i in {1..60}; do
            HEALTH_RESPONSE=$(curl -s http://localhost:8080/health/ready 2>/dev/null || echo '{"ready":false}')
            if echo "$HEALTH_RESPONSE" | grep -q '"ready":true'; then
              echo "All services are ready!"
              echo "$HEALTH_RESPONSE" | jq . 2>/dev/null || echo "$HEALTH_RESPONSE"
              break
            fi
            echo "Services not ready yet (attempt $i/60)..."
            echo "$HEALTH_RESPONSE" | jq . 2>/dev/null || echo "$HEALTH_RESPONSE"
            sleep 2
          done

      - name: Run API tests
        env:
          API_URL: http://localhost:8080
          SERVICE_KEY: VERY_SECRET_KEY
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bun run test:api:local integration

      - name: Show service logs on failure
        if: "!success()"
        run: |
          echo "=== API Logs (errors) ==="
          docker logs api-rest-api-1 2>&1 | grep -E "(error|Error|ERROR|failed|Failed)" -C 5 || true
          echo ""
          echo "=== Permissions Logs (errors) ==="
          docker logs api-permissions-1 2>&1 | grep -E "(error|Error|ERROR|failed|Failed)" -C 5 || true
          echo ""
          echo "=== Auth Logs (errors) ==="
          docker logs api-auth-1 2>&1 | grep -E "(error|Error|ERROR|failed|Failed)" -C 5 || true

      - name: Stop OmniBase
        if: always()
        working-directory: tests/api
        run: omnibase stop || true

  # ============================================
  # Release API (Docker + Core SDKs)
  # Only runs on push to main, not on PRs
  # ============================================
  release-api:
    name: Release API
    runs-on: ubuntu-latest
    needs: [check-skip, test]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.check-skip.outputs.skip_tests == 'true')
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for API changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --match "api-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous API release found, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- apps/api/ docker/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "API has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No API changes since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.has_changes == 'true'
        with:
          go-version: "1.21"

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate and build core-js SDK
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          bun run generate:sdk --js-only
          cd sdk/core/js && bun run build

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Make scripts executable
        if: steps.changes.outputs.has_changes == 'true'
        run: chmod +x scripts/*.sh

      - name: Regenerate SDKs
        if: steps.changes.outputs.has_changes == 'true'
        run: bun run generate:sdk

      - name: Release API
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: apps/api
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

  # ============================================
  # Release npm packages (independent versions)
  # Only runs on push to main, not on PRs
  # ============================================
  release-npm:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-skip, test, release-api, release-docker]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.check-skip.outputs.skip_tests == 'true') &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped') &&
      (needs.release-docker.result == 'success' || needs.release-docker.result == 'skipped')
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - package: sdk/framework/react
            name: react
          - package: sdk/framework/nextjs
            name: nextjs
          - package: sdk/component/shadcn
            name: shadcn
          - package: packages/cli
            name: cli

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.package }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Build package
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        run: bun run build || echo "No build script, skipping"

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  # ============================================
  # Release Docker images (independent versions)
  # Only runs on push to main, not on PRs
  # ============================================
  release-docker:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-skip, test, release-api]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.check-skip.outputs.skip_tests == 'true') &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - path: docker/auth
            name: auth
            image: phoenixsolutionsgroup/omnibase-auth
          - path: docker/permissions
            name: permissions
            image: phoenixsolutionsgroup/omnibase-permissions

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.path }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_IMAGE: ${{ matrix.image }}
        run: bunx semantic-release
