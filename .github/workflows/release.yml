name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          What to release: "all", or a comma-separated list of
          api, auth, permissions, react, nextjs, shadcn, cli, mcp-server
        type: string
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # Gate: Only proceed if tests passed
  # ============================================
  check-tests:
    name: Manual Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Release triggered
        run: echo "Manual release dispatched, proceeding"

  # ============================================
  # Select which packages this run releases
  # ============================================
  select:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.select.outputs.api }}
      docker: ${{ steps.select.outputs.docker }}
      npm: ${{ steps.select.outputs.npm }}
      dry: ${{ steps.select.outputs.dry }}
    steps:
      - name: Resolve selection
        id: select
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          SEL=$(echo "${PACKAGES:-all}" | tr -d '[:space:]')
          [ -z "$SEL" ] && SEL=all

          DOCKER='[{"path":"docker/auth","name":"auth","image":"phoenixsolutionsgroup/omnibase-auth","dockerfile":"Dockerfile","build_context":"."},{"path":"docker/permissions","name":"permissions","image":"phoenixsolutionsgroup/omnibase-permissions","dockerfile":"Dockerfile","build_context":"../.."}]'
          NPM='[{"package":"sdk/framework/react","name":"react"},{"package":"sdk/framework/nextjs","name":"nextjs"},{"package":"sdk/component/shadcn","name":"shadcn"},{"package":"packages/cli","name":"cli"},{"package":"packages/mcp-server","name":"mcp-server"}]'
          KNOWN="api auth permissions react nextjs shadcn cli mcp-server"

          if [ "$SEL" != "all" ]; then
            for name in ${SEL//,/ }; do
              case " $KNOWN " in
                *" $name "*) ;;
                *) echo "::error::Unknown package '$name'. Valid: all, ${KNOWN// /, }"; exit 1 ;;
              esac
            done
          fi

          filter='if $sel == "all" then . else map(select(.name as $n | $sel | split(",") | index($n))) end'
          DOCKER_JSON=$(jq -c --arg sel "$SEL" "$filter" <<< "$DOCKER")
          NPM_JSON=$(jq -c --arg sel "$SEL" "$filter" <<< "$NPM")
          if [ "$SEL" = "all" ] || [[ ",$SEL," == *",api,"* ]]; then
            API=true
            API_JSON='[{"kind":"api","name":"api","path":"apps/api"}]'
          else
            API=false
            API_JSON='[]'
          fi
          DRY=$(jq -c -n --argjson api "$API_JSON" --argjson docker "$DOCKER_JSON" --argjson npm "$NPM_JSON" \
            '$api + ($docker | map(. + {kind:"docker"})) + ($npm | map(. + {kind:"npm"}))')
          {
            echo "api=$API"
            echo "docker=$DOCKER_JSON"
            echo "npm=$NPM_JSON"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"


  # ============================================
  # Dry run every selected package before releasing
  # ============================================
  dry-run:
    name: Dry run ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-tests, select]
    if: needs.select.outputs.dry != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.select.outputs.dry) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: docker/setup-buildx-action@v3

      - name: Install dependencies (skip lifecycle scripts)
        run: bun install --ignore-scripts

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Dry run API release
        if: matrix.kind == 'api'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: "1"
        run: ./scripts/release-api-publish.sh 0.0.0-dryrun

      - name: Dry run Docker release
        if: matrix.kind == 'docker'
        working-directory: ${{ matrix.path }}
        env:
          DOCKER_IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DOCKER_BUILD_CONTEXT: ${{ matrix.build_context }}
          DRY_RUN: "1"
        run: ../../scripts/release-docker.sh 0.0.0-dryrun

      - name: Dry run npm release
        if: matrix.kind == 'npm'
        working-directory: ${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun run --cwd "$GITHUB_WORKSPACE/sdk/core/js" build
          npm pkg set version=0.0.0-dryrun
          bun run build
          bun pm pack --dry-run

  # ============================================
  # Release API (Docker + Core SDKs)
  # ============================================
  release-api:
    name: Release API
    runs-on: ubuntu-latest
    needs: [check-tests, select, dry-run]
    if: |
      needs.check-tests.result == 'success' &&
      (needs.dry-run.result == 'success' || needs.dry-run.result == 'skipped') &&
      needs.select.outputs.api == 'true'
    outputs:
      core_js_version: ${{ steps.corejs.outputs.version }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for API changes
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --match "api-v*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous API release found, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- apps/api/ docker/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "API has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No API changes since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.has_changes == 'true'
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: apps/api/go.sum

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Make scripts executable
        if: steps.changes.outputs.has_changes == 'true'
        run: chmod +x scripts/*.sh

      - name: Release API
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: apps/api
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npx semantic-release

      - name: Read published core-js version
        id: corejs
        if: always()
        run: echo "version=$(jq -r .version sdk/core/js/package.json)" >> $GITHUB_OUTPUT

  # ============================================
  # Release Docker images (independent versions)
  # ============================================
  release-docker:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-tests, select, release-api, dry-run]
    if: |
      !cancelled() &&
      needs.check-tests.result == 'success' &&
      (needs.dry-run.result == 'success' || needs.dry-run.result == 'skipped') &&
      needs.select.outputs.docker != '[]' &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.docker) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            PATHS="${{ matrix.path }}/"
            if [ "${{ matrix.name }}" = "permissions" ]; then
              PATHS="docker/permissions/ apps/api/permissions/"
            fi
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- $PATHS | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.has_changes == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.has_changes == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Pull latest changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git pull --rebase --autostash origin main

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DOCKER_IMAGE: ${{ matrix.image }}
        run: bunx semantic-release

  # ============================================
  # Release npm packages (independent versions)
  # ============================================
  release-npm:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check-tests, select, release-api, release-docker, dry-run]
    if: |
      !cancelled() &&
      needs.check-tests.result == 'success' &&
      (needs.dry-run.result == 'success' || needs.dry-run.result == 'skipped') &&
      needs.select.outputs.npm != '[]' &&
      (needs.release-api.result == 'success' || needs.release-api.result == 'skipped') &&
      (needs.release-docker.result == 'success' || needs.release-docker.result == 'skipped')
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.npm) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Check for changes
        id: changes
        run: |
          LAST_TAG=$(git tag -l "${{ matrix.name }}-v*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found for ${{ matrix.name }}, will release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git diff --name-only $LAST_TAG HEAD -- ${{ matrix.package }}/ | wc -l)
            if [ "$CHANGES" -gt 0 ]; then
              echo "${{ matrix.name }} has $CHANGES changed files since $LAST_TAG"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes for ${{ matrix.name }} since $LAST_TAG"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: oven-sh/setup-bun@v1
        if: steps.changes.outputs.has_changes == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.has_changes == 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies (skip lifecycle scripts)
        if: steps.changes.outputs.has_changes == 'true'
        run: bun install --ignore-scripts

      - name: Pull latest changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git pull --rebase --autostash origin main

      - name: Build core-js
        if: steps.changes.outputs.has_changes == 'true'
        run: bun run --cwd sdk/core/js build

      - name: Build package
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        run: bun run build || echo "No build script, skipping"

      - name: Release
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CORE_JS_VERSION: ${{ needs.release-api.outputs.core_js_version }}
        run: npx semantic-release
