name: Deploy Apps

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Cloud branch to deploy to
        type: choice
        options: [dev, main]
        default: dev
      app:
        description: App to deploy
        type: choice
        options: [all, dashboard, docs, website]
        default: all

permissions:
  contents: write

concurrency:
  group: deploy-apps-${{ github.event_name == 'workflow_run' && 'main' || github.event_name == 'push' && 'dev' || inputs.env }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      env: ${{ steps.plan.outputs.env }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - name: Resolve target
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          case "$EVENT" in
            push) ENV_NAME=dev ;;
            workflow_run) ENV_NAME=main ;;
            *) ENV_NAME="$INPUT_ENV" ;;
          esac

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_APP" != "all" ]; then
            APPS="[\"$INPUT_APP\"]"
          else
            APPS='["dashboard","docs","website"]'
          fi

          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.app }} (${{ needs.plan.outputs.env }})
    needs: [plan]
    environment: ${{ needs.plan.outputs.env == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env }}
      MANAGED_HOSTING_API_URL: ${{ secrets.MANAGED_HOSTING_API_URL }}
      WORKER_DOMAIN: ${{ vars.OMNIBASE_WORKER_DOMAIN || 'workers.omnibase.tech' }}
      COOKIE_DOMAIN: ${{ secrets.OMNIBASE_COOKIE_DOMAIN }}
    steps:
      # After a Release, build from the latest main so the release commits are included.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        if: matrix.app == 'docs'
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        env:
          HUSKY: 0
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: bun run build:packages

      - name: Fetch release tags
        if: matrix.app == 'docs'
        run: git fetch --unshallow --tags --force 2>/dev/null || git fetch --tags --force

      - name: Resolve release version
        if: matrix.app == 'docs'
        id: release
        run: |
          VERSION=$(git describe --tags --match 'api-v*' --abbrev=0 2>/dev/null | sed 's/^api-v//' || true)
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"

      - name: Generate docs
        if: matrix.app == 'docs'
        env:
          API_VERSION: ${{ steps.release.outputs.version }}
        run: bun run generate:docs

      - name: Generate docs source
        if: matrix.app == 'docs'
        working-directory: apps/docs
        run: bun run postinstall

      - name: Configure git
        if: matrix.app == 'docs' && github.event_name == 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit generated docs
        if: matrix.app == 'docs' && github.event_name == 'workflow_run'
        continue-on-error: true
        run: |
          git add apps/docs/content apps/docs/openapi.yaml apps/docs/openapi.json apps/api/docs/openapi.json
          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
            exit 0
          fi
          git commit -m "docs: auto-generate API and SDK documentation [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::Could not rebase generated docs onto main"
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not push generated docs to main; continuing without persisting them"

      - name: Authenticate CLI
        env:
          OMNIBASE_API_KEY: ${{ secrets.OMNIBASE_API_KEY }}
        run: |
          if [ -z "$OMNIBASE_API_KEY" ]; then
            echo "::error::OMNIBASE_API_KEY repository secret is required"
            exit 1
          fi
          bun packages/cli/src/index.ts cloud login "$OMNIBASE_API_KEY" \
            --url "$MANAGED_HOSTING_API_URL" \
            --name ci

      - name: Write branch environment
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.OMNIBASE_COOKIE_SECRET }}
        run: |
          ENV_FILE="omnibase/.env.$DEPLOY_ENV"
          COOKIE_ARGS=()
          if [ -n "$COOKIE_DOMAIN" ]; then
            COOKIE_ARGS=(--cookie-domain "$COOKIE_DOMAIN")
          fi
          bun packages/cli/src/index.ts cloud branch env "$DEPLOY_ENV" \
            --worker-domain "$WORKER_DOMAIN" \
            "${COOKIE_ARGS[@]}" \
            --output "$ENV_FILE"

          append_env() {
            if [ -n "$2" ]; then
              printf '%s=%s\n' "$1" "$2" >> "$ENV_FILE"
            fi
          }

          append_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          append_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          append_env COOKIE_SECRET "$COOKIE_SECRET"

      - name: Deploy ${{ matrix.app }}
        run: bun packages/cli/src/index.ts --env "$DEPLOY_ENV" cloud workers deploy --name "${{ matrix.app }}"
