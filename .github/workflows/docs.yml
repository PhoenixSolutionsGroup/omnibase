name: Generate Documentation

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ============================================
  # Gate: Only proceed if release succeeded
  # ============================================
  check-release:
    name: Check Release Passed
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Release passed
        run: echo "Release passed, proceeding with documentation generation"

  generate:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: [check-release]
    if: needs.check-release.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Generate SDK
        run: bun run generate:sdk

      - name: Build core-js SDK
        run: cd sdk/core/js && bun run build

      - name: Generate documentation
        run: bun run generate:docs

      - name: Commit generated docs
        run: |
          git add apps/docs/content/
          git add apps/docs/openapi.yaml
          git add apps/api/docs/openapi.yaml
          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs: auto-generate API and SDK documentation [skip ci]"
            git push origin main
          fi

      - name: Deploy docs site to Vercel
        env:
          VERCEL_DOCS_DEPLOY_HOOK: ${{ secrets.VERCEL_DOCS_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DOCS_DEPLOY_HOOK"
