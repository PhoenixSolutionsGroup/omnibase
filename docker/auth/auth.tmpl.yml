version: v1.3.0

dsn: memory

serve:
  public:
    base_url: ${API_PUBLIC_URL}/api/v1/auth/proxy
    cors:
      enabled: true
      allowed_origins:
        - ${WEBSITE_URL}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
      debug: true
  admin:
    base_url: ${AUTH_ADMIN_URL}

selfservice:    
  default_browser_return_url: ${WEBSITE_URL}
  allowed_return_urls:
    - ${WEBSITE_URL}

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: ${APP_NAME}
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:{{OIDC_PROVIDERS}}

  flows:
    error:
      ui_url: ${WEBSITE_AUTH_ERROR_URL}

    settings:
      ui_url: ${WEBSITE_SETTING_URL}
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: ${WEBSITE_RECOVERY_URL}
      use: code

    verification:
      enabled: true
      ui_url: ${WEBSITE_VERIFICATION_RECOVERY_URL}
      use: code
      after:
        default_browser_return_url: ${WEBSITE_URL}

    logout:
      after:
        default_browser_return_url: ${WEBSITE_LOGIN_URL}

    login:
      ui_url: ${WEBSITE_LOGIN_URL}
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: require_verified_address

    registration:
      lifespan: 10m
      ui_url: ${WEBSITE_REGISTRATION_URL}
      after:
        password:
          hooks:
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session

log:
  level: ${LOG_LEVEL}
  format: json

secrets:
  cookie:
    - ${COOKIE_SECRET}
  cipher:
    - ${CIPHER_SECRET}

cookies:
  domain: ${COOKIE_DOMAIN}
  same_site: Lax

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/auth/identity.schema.json

session:
  whoami:
    tokenizer:
      templates:
        jwt:
          jwks_url: file:///tmp/auth/tokenizer-templates/jwt/jwks.json
          ttl: 10m
          claims_mapper_url: file:///etc/config/auth/jwt/claims.jsonnet

courier:
  smtp:
    connection_uri: ${SMTP_CONNECTION_URI}
    from_address: ${SMTP_FROM_ADDRESS}
    from_name: ${SMTP_FROM_NAME}
  templates:
    verification_code:
      valid:
        email:
          body:
            plaintext: file:///tmp/auth/templates/verification/valid/email.body.plaintext.gotmpl
            html: file:///tmp/auth/templates/verification/valid/email.body.gotmpl
          subject: file:///tmp/auth/templates/verification/valid/email.subject.gotmpl
      invalid:
        email:
          body:
            plaintext: file:///tmp/auth/templates/verification_invalid/valid/email.body.plaintext.gotmpl
            html: file:///tmp/auth/templates/verification_invalid/valid/email.body.gotmpl
          subject: file:///tmp/auth/templates/verification_invalid/valid/email.subject.gotmpl
    recovery_code:
      valid:
        email:
          body:
            plaintext: file:///tmp/auth/templates/recovery/valid/email.body.plaintext.gotmpl
            html: file:///tmp/auth/templates/recovery/valid/email.body.gotmpl
          subject: file:///tmp/auth/templates/recovery/valid/email.subject.gotmpl
      invalid:
        email:
          body:
            plaintext: file:///tmp/auth/templates/recovery_invalid/valid/email.body.plaintext.gotmpl
            html: file:///tmp/auth/templates/recovery_invalid/valid/email.body.gotmpl
          subject: file:///tmp/auth/templates/recovery_invalid/valid/email.subject.gotmpl