version: v0.13.0

dsn: memory

serve:
  public:
    base_url: ${AUTH_URL}
    cors:
      enabled: true
      allowed_origins:
        - ${WEBSITE_URL}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
      debug: true
  admin:
    base_url: ${AUTH_ADMIN_URL}

selfservice:    
  default_browser_return_url: ${WEBSITE_AUTH_RETURN_URL}
  allowed_return_urls:
    - ${WEBSITE_URL}
    - http://localhost:19006/Callback
    - exp://localhost:8081/--/Callback

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: Kratos
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: ${GOOGLE_CLIENT_ID}
            client_secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet

  flows:
    error:
      ui_url: ${WEBSITE_AUTH_ERROR_URL}

    settings:
      ui_url: ${WEBSITE_SETTING_URL}
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: ${WEBSITE_RECOVERY_URL}
      use: code

    verification:
      enabled: true
      ui_url: ${WEBSITE_VERIFICATION_RECOVERY_URL}
      use: code
      after:
        default_browser_return_url: ${WEBSITE_ONBOARDING_URL}

    logout:
      after:
        default_browser_return_url: ${WEBSITE_LOGIN_URL}

    login:
      ui_url: ${WEBSITE_LOGIN_URL}
      lifespan: 10m
      after:
        default_browser_return_url: ${WEBSITE_AUTH_CALLBACK}

    registration:
      lifespan: 10m
      ui_url: ${WEBSITE_REGISTRATION_URL}
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session

log:
  level: info
  format: json

secrets:
  cookie:
    - ${COOKIE_SECRET}
  cipher:
    - ${CIPHER_SECRET}

cookies:
  domain: ${COOKIE_DOMAIN}
  same_site: Lax

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: ${IDENTITY_SCHEMA_URL}

courier:
  smtp:
    connection_uri: ${SMTP_CONNECTION_URI}
    from_address: ${SMTP_FROM_ADDRESS}
    from_name: ${SMTP_FROM_NAME}
